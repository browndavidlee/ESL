    }

    function setEsGameMode(mode) {
      appState.esGameMode = mode;
      appState.esGameFilter = "all";
      renderEsJuegosTab(document.getElementById("esTabStage"));
    }

    function setEsGameFilter(f) {
      appState.esGameFilter = f;
      renderEsGameFilters();
      nextEsGameQuestion(false);
    }

    function renderEsGameFilters() {
      const bar = document.getElementById("esGameFilters");
      if (!bar) return;
      const m = appState.esGameMode;
      let chips = [];
      if (["foto", "faltante", "arma", "dictado"].includes(m)) {
        chips = [
          { id: "all", label: "Todas (T + D + R)" },
          { id: "T", label: "Familia T" },
          { id: "D", label: "Familia D" },
          { id: "R", label: "Familia R" },
          { id: "missed", label: "🔄 Difíciles" }
        ];
      } else if (m === "inversa") {
        chips = [
          { id: "all", label: "Todas (al/el/il/ol/ul + as/es/is/os/us)" },
          { id: "L", label: "Solo al-el-il-ol-ul" },
          { id: "S", label: "Solo as-es-is-os-us" }
        ];
      } else {
        chips = [{ id: "all", label: "Páginas 5 y 7" }];
      }
      bar.innerHTML = chips.map(c => `
        <button type="button" class="filter-chip ${appState.esGameFilter === c.id ? "active" : ""}" onclick="setEsGameFilter('${c.id}')">${c.label}</button>
      `).join("");
    }

    function getFilteredEsPool() {
      let pool = SPANISH_SYLLABLE_WORDS;
      if (["T", "D", "R"].includes(appState.esGameFilter)) pool = pool.filter(w => w.family === appState.esGameFilter);
      if (appState.esGameFilter === "missed") {
        const m = pool.filter(w => progress.spanish.missed[w.id]);
        if (m.length) pool = m;
      }
      return pool;
    }

    function nextEsGameQuestion(speakOnAdvance = false) {
      const body = document.getElementById("esGameBody");
      if (!body) return;
      const mode = appState.esGameMode;

      if (mode === "foto") {
        const pool = getFilteredEsPool();
        const target = pool[Math.floor(Math.random() * pool.length)];
        const dist = shuffle(SPANISH_SYLLABLE_WORDS.filter(w => w.id !== target.id && w.family === target.family)).slice(0, 3);
        const opts = shuffle([target, ...dist]);
        appState.esGameQ = { mode, target, opts, solved: false };
        body.innerHTML = `
          <div class="stage-photo">${renderVisualBox(target.photoKey, "", false)}</div>
          <div class="prompt-banner">🖼️ ¿Qué palabra corresponde a esta imagen? ${speakBtnHTML(target.word, "es", "🔊 Pista", false, "btn-slow")}</div>
          <div class="choices-grid">
            ${opts.map((o, i) => `<button type="button" class="choice-tile" onclick="answerEsGame(${i}, this)">${escapeHTML(o.word)}</button>`).join("")}
          </div>
          <div id="esGameFb" class="feedback-banner"></div>
          <div style="text-align:center; margin-top:14px;"><button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente ➡️</button></div>
        `;
        if (speakOnAdvance) MobileAudioEngine.speak(target.word, "es");
      } else if (mode === "faltante") {
        const pool = getFilteredEsPool();
        const target = pool[Math.floor(Math.random() * pool.length)];
        const famSyls = target.family === "T" ? ["ta","te","ti","to","tu"] : target.family === "D" ? ["da","de","di","do","du"] : (target.targetSyl === "rí" ? ["ra","re","rí","ro","ru"] : ["ra","re","ri","ro","ru"]);
        appState.esGameQ = { mode, target, opts: famSyls, solved: false };
        body.innerHTML = `
          <div class="stage-photo">${renderVisualBox(target.photoKey, "Familia " + target.family, false)}</div>
          <div class="prompt-banner" style="font-size:1.55rem;">
            <span>${escapeHTML(target.blankDisplay)}</span>
            ${speakBtnHTML(target.word, "es", "🔊 Escuchar", false, "btn-speak")}
          </div>
          <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:12px 0;">
            ${famSyls.map((s, i) => `<button type="button" class="choice-tile" style="min-width:74px;" onclick="answerEsGame(${i}, this)">${s}</button>`).join("")}
          </div>
          <div id="esGameFb" class="feedback-banner"></div>
          <div style="text-align:center; margin-top:14px;"><button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente ➡️</button></div>
        `;
        if (speakOnAdvance) MobileAudioEngine.speak(target.word, "es");
      } else if (mode === "arma") {
        const pool = getFilteredEsPool().filter(w => w.syls.length >= 2);
        const target = pool[Math.floor(Math.random() * pool.length)];
        const tiles = shuffle(target.syls.map((s, idx) => ({ s, idx })));
        appState.esGameQ = { mode, target, tiles, picked: [], solved: false };
        renderEsArmaBoard();
        if (speakOnAdvance) MobileAudioEngine.speak(target.word, "es");
      } else if (mode === "inversa") {
        let pool = INVERSAS_WORDS;
        if (appState.esGameFilter === "L" || appState.esGameFilter === "S") pool = pool.filter(w => w.group === appState.esGameFilter);
        const target = pool[Math.floor(Math.random() * pool.length)];
        const opts = target.group === "L" ? ["al","el","il","ol","ul"] : ["as","es","is","os","us"];
        appState.esGameQ = { mode, target, opts, solved: false };
        body.innerHTML = `
          <div class="stage-photo">${renderVisualBox(target.photoKey, "Sílaba Inversa", false)}</div>
          <div class="prompt-banner">
            🔄 ¿Qué sílaba inversa tiene <strong style="color:#b45309;">${escapeHTML(target.word)}</strong>?
            ${speakBtnHTML(target.word, "es", "🔊 Oír", false, "btn-slow")}
          </div>
          <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:12px 0;">
            ${opts.map((s, i) => `<button type="button" class="choice-tile" style="min-width:74px;" onclick="answerEsGame(${i}, this)">${s}</button>`).join("")}
          </div>
          <div id="esGameFb" class="feedback-banner"></div>
          <div style="text-align:center; margin-top:14px;"><button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente ➡️</button></div>
        `;
        if (speakOnAdvance) MobileAudioEngine.speak(target.word, "es");
      } else if (mode === "dictado") {
        const pool = getFilteredEsPool();
        const target = pool[Math.floor(Math.random() * pool.length)];
        appState.esGameQ = { mode, target, solved: false };
        body.innerHTML = `
          <div class="stage-photo">${renderVisualBox(target.photoKey, "Dictado", false)}</div>
          <div class="prompt-banner">
            ✏️ Escucha y escribe la palabra completa!
            <div style="font-size:0.92rem; color:var(--muted); margin:4px 0 8px;">💡 ${escapeHTML(target.meaning)}</div>
            ${speakBtnHTML(target.word, "es", "🔊 Escuchar Palabra")}
            ${speakBtnHTML(target.word, "es", "🐢 Despacito", true, "btn-slow")}
          </div>
          <div class="spell-input-wrap">
            <input id="esDictadoInput" class="spell-text-input" type="text" placeholder="escribe aquí…"
              autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
              onkeydown="if(event.key==='Enter') checkEsDictado()" />
            <div class="accent-keyboard">
              ${["á","é","í","ó","ú","ñ"].map(ch => `<button type="button" class="accent-key" onclick="insertAccentChar('esDictadoInput','${ch}')">${ch}</button>`).join("")}
            </div>
            <button type="button" class="primary-action" onclick="checkEsDictado()">Revisar ✅</button>
          </div>
          <div id="esGameFb" class="feedback-banner"></div>
          <div style="text-align:center; margin-top:14px;"><button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente Palabra ➡️</button></div>
        `;
        if (speakOnAdvance) MobileAudioEngine.speak(target.word, "es");
      } else {
        // Salto de la Rana (Página 5 + Página 7)
        const bankNames = P5_BANK.map(b => b.word);
        const pool = [
          ...P5_SENTENCES.map(s => ({
            id: "p5_" + s.n, photoKey: s.photoKey,
            q: `Completa la oración: "${s.before}__________${s.after}"`,
            audio: `${s.before} espacio ${s.after}`,
            opts: bankNames, ans: bankNames.indexOf(s.ans),
            tip: `${s.before}${s.ans}${s.after}`
          })),
          ...RANA_QUESTIONS.map(rq => ({
            id: rq.id, photoKey: "en_frogpond",
            q: `La rana saltarina — ${rq.q}`, audio: rq.q,
            opts: rq.opts, ans: rq.ans, tip: rq.fullAns
          }))
        ];
        const target = pool[Math.floor(Math.random() * pool.length)];
        appState.esGameQ = { mode, target, solved: false };
        body.innerHTML = `
          <div class="stage-photo">${renderVisualBox(target.photoKey, "Lectura", false)}</div>
          <div class="prompt-banner">${escapeHTML(target.q)} ${speakBtnHTML(target.audio, "es", "🔊 Oír", false, "btn-slow")}</div>
          <div class="choices-grid">
            ${target.opts.map((o, i) => `<button type="button" class="choice-tile" style="font-size:1.05rem;" onclick="answerEsGame(${i}, this)">${escapeHTML(o)}</button>`).join("")}
          </div>
          <div id="esGameFb" class="feedback-banner"></div>
          <div style="text-align:center; margin-top:14px;"><button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente Salto ➡️</button></div>
        `;
        if (speakOnAdvance) MobileAudioEngine.speak(target.audio, "es");
      }
    }

    function renderEsArmaBoard() {
      const q = appState.esGameQ;
      const body = document.getElementById("esGameBody");
      if (!q || !body) return;
      const builtWord = q.picked.map(t => t.s).join("");
      body.innerHTML = `
        <div class="stage-photo">${renderVisualBox(q.target.photoKey, "Arma la palabra", false)}</div>
        <div class="prompt-banner">
          🧱 Toca las sílabas en orden para armar la palabra:
          ${speakBtnHTML(q.target.word, "es", "🔊 Escuchar", false, "btn-speak")}
        </div>
        <div class="build-slot-bar">
          ${q.picked.length ? q.picked.map(t => `<span class="syl-box focus-gold">${escapeHTML(t.s)}</span>`).join("") : `<span style="color:var(--muted); font-size:0.95rem;">Toca las sílabas de abajo…</span>`}
        </div>
        <div class="tile-tray">
          ${q.tiles.map((t, ti) => {
            const used = q.picked.includes(t);
            return `<button type="button" class="choice-tile" style="min-width:78px; opacity:${used ? "0.35" : "1"};" ${used ? "disabled" : ""} onclick="pickEsArmaTile(${ti})">${escapeHTML(t.s)}</button>`;
          }).join("")}
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
          <button type="button" class="secondary-action" onclick="clearEsArma()">🔄 Borrar</button>
          <button type="button" class="secondary-action" onclick="nextEsGameQuestion(true)">Siguiente ➡️</button>
        </div>
        <div id="esGameFb" class="feedback-banner ${q.solved ? "show ok" : (builtWord.length && q.picked.length === q.tiles.length && !q.solved ? "show nope" : "")}">
          ${q.solved ? `🎉 ¡Excelente, Sol! Armaste <strong>${escapeHTML(q.target.word)}</strong>! (+2 ⭐)` : (q.picked.length === q.tiles.length && !q.solved ? `Armaste "${escapeHTML(builtWord)}". ¡Toca Borrar e inténtalo en el orden correcto!` : "")}
        </div>
      `;
    }

    function pickEsArmaTile(ti) {
      const q = appState.esGameQ;
      if (!q || q.solved) return;
      const tile = q.tiles[ti];
      q.picked.push(tile);
      MobileAudioEngine.playTone(580, 0.09);
      if (q.picked.length === q.tiles.length) {
        const built = q.picked.map(x => x.s).join("");
        if (built === q.target.word) {
          q.solved = true;
          MobileAudioEngine.playSuccessChime();
          MobileAudioEngine.speak(`¡Bravo! ${q.target.word}`, "es");
          markProgress("spanish", q.target.id, true, 2);
          launchConfetti(28);
        } else {
          MobileAudioEngine.playTryAgainSound();
          markMissed("spanish", q.target.id);
        }
      }
      renderEsArmaBoard();
    }

    function clearEsArma() {
      if (!appState.esGameQ) return;
      appState.esGameQ.picked = [];
      appState.esGameQ.solved = false;
      renderEsArmaBoard();
    }

    function insertAccentChar(inputId, ch) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const start = inp.selectionStart || inp.value.length;
      const end = inp.selectionEnd || inp.value.length;
      inp.value = inp.value.slice(0, start) + ch + inp.value.slice(end);
      inp.focus();
      MobileAudioEngine.playTone(620, 0.07);
    }

    function answerEsGame(idx, btn) {
      const q = appState.esGameQ;
      if (!q || q.solved) return;
      const fb = document.getElementById("esGameFb");
      let ok = false, okMsg = "", noMsg = "", trackId = q.target.id;

      if (q.mode === "foto") {
        const chosen = q.opts[idx];
        ok = chosen.id === q.target.id;
        okMsg = `🎉 ¡Muy bien, Sol! Es <strong>${escapeHTML(q.target.word)}</strong>.`;
        noMsg = `Esa palabra dice <strong>${escapeHTML(chosen.word)}</strong>. Pista: ${escapeHTML(q.target.tip)}`;
        if (ok) MobileAudioEngine.speak(q.target.word, "es");
      } else if (q.mode === "faltante") {
        const syl = q.opts[idx];
        ok = syl === q.target.targetSyl;
        okMsg = `🎉 ¡Bravo! <strong>${escapeHTML(q.target.word)}</strong> lleva la sílaba <strong>${escapeHTML(q.target.targetSyl)}</strong>.`;
        noMsg = `Escucha bien "${escapeHTML(q.target.word)}". ${escapeHTML(q.target.tip)}`;
        if (ok) MobileAudioEngine.speak(q.target.word, "es");
      } else if (q.mode === "inversa") {
        const syl = q.opts[idx];
        ok = syl === q.target.syl;
        okMsg = `🔄 ¡Correcto! <strong>${escapeHTML(q.target.word)}</strong> lleva la sílaba inversa <strong>${escapeHTML(q.target.syl)}</strong>.`;
        noMsg = `Escucha primero la vocal en "${escapeHTML(q.target.word)}". ${escapeHTML(q.target.note)}`;
        if (ok) MobileAudioEngine.speak(q.target.word, "es");
      } else if (q.mode === "rana") {
        ok = idx === q.target.ans;
        okMsg = `🐸 ¡Salto perfecto! "${escapeHTML(q.target.tip)}"`;
        noMsg = `¡Casi! Escucha la oración otra vez y prueba de nuevo.`;
        if (ok) MobileAudioEngine.speak(q.target.tip, "es");
      }

      if (ok) {
        q.solved = true;
        btn.classList.add("correct");
        MobileAudioEngine.playSuccessChime();
        markProgress("spanish", trackId, true, 1);
        fb.className = "feedback-banner show ok";
        fb.innerHTML = okMsg;
      } else {
        btn.classList.add("wrong");
        MobileAudioEngine.playTryAgainSound();
        markMissed("spanish", trackId);
        fb.className = "feedback-banner show nope";
        fb.innerHTML = noMsg;
      }
    }

    function checkEsDictado() {
      const q = appState.esGameQ;
      if (!q || q.solved) return;
      const inp = document.getElementById("esDictadoInput");
      const fb = document.getElementById("esGameFb");
      const raw = (inp.value || "").trim().toLowerCase();
      const exact = raw === q.target.word;
      const folded = normalizeText(raw) === normalizeText(q.target.word);

      if (exact || folded) {
        q.solved = true;
        MobileAudioEngine.playSuccessChime();
        MobileAudioEngine.speak(`¡Excelente, Sol! ${q.target.word}`, "es");
        markProgress("spanish", q.target.id, true, 2);
        launchConfetti(32);
        fb.className = "feedback-banner show ok";
        fb.innerHTML = exact
          ? `🏆 ¡Perfecto, Sol! Escribiste <strong>${escapeHTML(q.target.word)}</strong> con excelente ortografía! (+2 ⭐)`
          : `🌟 ¡Muy bien! Solo recuerda poner la tilde: <strong>${escapeHTML(q.target.word)}</strong> (+2 ⭐)`;
      } else {
        MobileAudioEngine.playTryAgainSound();
        markMissed("spanish", q.target.id);
        fb.className = "feedback-banner show nope";
        fb.innerHTML = `Escribiste <strong>${escapeHTML(raw || "nada")}</strong>. Escucha despacito y revisa cada sílaba: ${escapeHTML(q.target.tip)}`;
      }
    }

    // ---------- ES PESTAÑA 6: CUADERNILLO (57 EJERCICIOS) Y EXAMEN SIMULADO DE ESPAÑOL ----------
    function renderEsExamenYHojaTab(stage) {
      const tWords = SPANISH_SYLLABLE_WORDS.filter(w => w.family === "T");
      const dWords = SPANISH_SYLLABLE_WORDS.filter(w => w.family === "D");

      const sylRows = (arr, pre, opts) => arr.map((w, i) => `

          <div style="display:flex; align-items:center; gap:8px;">
            ${speakBtnHTML(w.word, "es", "🔊", false, "btn-slow")}
            <span><strong>${i + 1}.</strong> ${escapeHTML(w.blankDisplay)} <span style="color:var(--muted); font-size:0.84rem;">(${escapeHTML(w.meaning)})</span></span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <select class="ws-select" id="${pre}-sel-${i}">
              <option value="">-- sílaba --</option>
              ${opts.map(o => `<option value="${o}">${o}</option>`).join("")}
            </select>
            <span id="${pre}-mk-${i}"></span>
          </div>

      `).join("");

      stage.innerHTML = `
        <div class="stage-card" id="esMockExamBox" style="margin-bottom:20px;"></div>

        <div class="content-box">
          <h3>⭐ Mapa de Dominio de Español de Sol</h3>
          <p style="font-size:0.86rem; color:var(--muted); font-weight:700; margin:4px 0 0;">Verde = ¡Dominada! Amarillo = En práctica. Rojo = Conviene repasar otra vez.</p>
          <div id="esReadinessMap" class="tracker-grid"></div>
        </div>

        <div class="content-box">
          <h3>📄 Verificador Completo del Cuadernillo de Español (57 Ejercicios — Páginas 2 a 7)</h3>
          <div class="icq-strip"><strong>Revisa tu cuadernillo antes del examen:</strong> Contesta cada fila y presiona <em>¡Revisar Toda Mi Hoja de Español!</em></div>

          <h4 style="margin:12px 0 8px; color:#c92a2a;">Página 2: Completa con ta - te - ti - to - tu</h4>
          <div class="ws-list">${sylRows(tWords, "esws-t", ["ta","te","ti","to","tu"])}</div>

          <h4 style="margin:16px 0 8px; color:#5f3dc4;">Página 3: Completa con da - de - di - do - du (¡Ojo con in-di-o y ca-de-na!)</h4>
          <div class="ws-list">${sylRows(dWords, "esws-d", ["da","de","di","do","du"])}</div>

          <h4 style="margin:16px 0 8px; color:#087f5b;">Página 4: Completa con ra - re - ri - rí - ro - ru</h4>
          <div class="ws-list">${sylRows(rWords, "esws-r", ["ra","re","ri","rí","ro","ru"])}</div>

          <h4 style="margin:16px 0 8px; color:#b45309;">Página 5: Completa la oración (manzana, perro, pelota, pato, casa)</h4>
          <div class="ws-list">
            ${P5_SENTENCES.map((s, i) => `
              <div class="ws-row" id="esws-p5-row-${i}">
                <span><strong>${s.n}.</strong> ${escapeHTML(s.before)}__________${escapeHTML(s.after)}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  <select class="ws-select" id="esws-p5-sel-${i}">
                    <option value="">-- palabra --</option>
                    ${P5_BANK.map(b => `<option value="${b.word}">${b.word}</option>`).join("")}
                  </select>
                  <span id="esws-p5-mk-${i}"></span>
                </div>
              </div>
            `).join("")}
          </div>

          <h4 style="margin:16px 0 8px; color:#1864ab;">Página 6: Clasifica Palabras con Sílabas Inversas</h4>
          <div class="ws-list">
            ${ES_WS_INV_CHECK.map((it, i) => `
              <div class="ws-row" id="esws-inv-row-${i}">
                <div style="display:flex; align-items:center; gap:8px;">
                  ${speakBtnHTML(it.word, "es", "🔊", false, "btn-slow")}
                  <span><strong>${i + 1}.</strong> ${it.word}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <select class="ws-select" id="esws-inv-sel-${i}">
                    <option value="">-- grupo --</option>
                    <option value="al-el-il-ol-ul">al-el-il-ol-ul</option>
                    <option value="as-es-is-os-us">as-es-is-os-us</option>
                  </select>
                  <span id="esws-inv-mk-${i}"></span>
                </div>
              </div>
            `).join("")}
          </div>

          <h4 style="margin:16px 0 8px; color:#2b8a3e;">Página 7: Comprensión Lectora "La rana saltarina"</h4>
          <div class="ws-list">
            ${RANA_QUESTIONS.map((rq, i) => `
              <div class="ws-row" id="esws-rana-row-${i}">
                <span>${escapeHTML(rq.q)}</span>
                <div style="display:flex; align-items:center; gap:8px;">
                  <select class="ws-select" id="esws-rana-sel-${i}">
                    <option value="">-- respuesta --</option>
                    ${rq.opts.map((o, oi) => `<option value="${oi}">${escapeHTML(o)}</option>`).join("")}
                  </select>
                  <span id="esws-rana-mk-${i}"></span>
                </div>
              </div>

    function gradeEsWorksheet() {
      let score = 0, total = 0;
      SPANISH_SYLLABLE_WORDS.filter(w => w.family === "T").forEach((w, i) => { total++; if (gradeRow(`esws-t-sel-${i}`, `esws-t-mk-${i}`, `esws-t-row-${i}`, w.targetSyl)) score++; });
      SPANISH_SYLLABLE_WORDS.filter(w => w.family === "D").forEach((w, i) => { total++; if (gradeRow(`esws-d-sel-${i}`, `esws-d-mk-${i}`, `esws-d-row-${i}`, w.targetSyl)) score++; });
      SPANISH_SYLLABLE_WORDS.filter(w => w.family === "R").forEach((w, i) => { total++; if (gradeRow(`esws-r-sel-${i}`, `esws-r-mk-${i}`, `esws-r-row-${i}`, w.targetSyl)) score++; });
      P5_SENTENCES.forEach((s, i) => { total++; if (gradeRow(`esws-p5-sel-${i}`, `esws-p5-mk-${i}`, `esws-p5-row-${i}`, s.ans)) score++; });
      ES_WS_INV_CHECK.forEach((it, i) => { total++; if (gradeRow(`esws-inv-sel-${i}`, `esws-inv-mk-${i}`, `esws-inv-row-${i}`, it.ans)) score++; });
      RANA_QUESTIONS.forEach((rq, i) => { total++; if (gradeRow(`esws-rana-sel-${i}`, `esws-rana-mk-${i}`, `esws-rana-row-${i}`, rq.ans)) score++; });

      const msg = document.getElementById("esWsScoreMsg");
      if (score === total) {
        MobileAudioEngine.playSuccessChime();
        launchConfetti(60);
        markProgress("spanish", null, false, 8);
        msg.style.color = "#2b8a3e";
        msg.textContent = `🎉 ¡${score}/${total} Perfecto, Sol! ¡Dominas todo el cuadernillo de Español! (+8 ⭐)`;
      } else {
        MobileAudioEngine.playTryAgainSound();
        msg.style.color = "#b45309";
        msg.textContent = `Llevas ${score}/${total} correctas. ¡Corrige las filas rojas y revisa otra vez!`;
      }
    }

    function buildEsExamQuestions(count) {
      const pool = [];
      ["T", "D", "R"].forEach(fam => {
        const base = fam === "T" ? ["ta","te","ti","to","tu"] : fam === "D" ? ["da","de","di","do","du"] : ["ra","re","ri","ro","ru"];
        shuffle(SPANISH_SYLLABLE_WORDS.filter(w => w.family === fam)).slice(0, 3).forEach(w => {
          const opts = w.targetSyl === "rí" ? ["ra","re","rí","ro","ru"] : base;
          pool.push({ id: w.id, photoKey: w.photoKey, prompt: `Completa la sílaba faltante: ${w.blankDisplay}`, audio: w.word, type: "choice", opts, ans: opts.indexOf(w.targetSyl), tip: `${w.word}: ${w.tip}` });
        });
      });
      shuffle(SPANISH_SYLLABLE_WORDS).slice(0, 3).forEach(w => pool.push({
        id: w.id, photoKey: w.photoKey, prompt: `Dictado: escribe la palabra completa (${w.meaning})`, audio: w.word, type: "type", ansWord: w.word, tip: w.tip
      }));
      const bank = P5_BANK.map(b => b.word);
      shuffle(P5_SENTENCES).slice(0, 3).forEach(s => pool.push({
        id: "p5_" + s.n, photoKey: s.photoKey, prompt: `Completa la oración: "${s.before}__________${s.after}"`, audio: `${s.before} espacio ${s.after}`, type: "choice", opts: bank, ans: bank.indexOf(s.ans), tip: `${s.before}${s.ans}${s.after}`
      }));
      shuffle(INVERSAS_WORDS).slice(0, 4).forEach(iv => {
        const opts = iv.group === "L" ? ["al","el","il","ol","ul"] : ["as","es","is","os","us"];
        pool.push({ id: iv.id, photoKey: iv.photoKey, prompt: `¿Qué sílaba inversa lleva "${iv.word}"?`, audio: iv.word, type: "choice", opts, ans: opts.indexOf(iv.syl), tip: iv.note });
      });
      shuffle(RANA_QUESTIONS).slice(0, 3).forEach(rq => pool.push({
        id: rq.id, photoKey: "en_frogpond", prompt: `La rana saltarina — ${rq.q}`, audio: rq.q, type: "choice", opts: rq.opts, ans: rq.ans, tip: rq.fullAns
      }));
      return shuffle(pool).slice(0, count);
    }

    function startEsMockExam(count) {
      appState.esExam = { active: true, list: buildEsExamQuestions(count), idx: 0, results: [] };
      renderEsMockExamUI();
      const first = appState.esExam.list[0];
      if (first) MobileAudioEngine.speak(first.audio, "es");
    }

    function renderEsMockExamUI() {
      const box = document.getElementById("esMockExamBox");
      if (!box) return;
      const ex = appState.esExam;
      if (!ex.active) {
        box.innerHTML = `
          <div style="text-align:center; padding:8px;">
            <div style="font-size:2.8rem;">🏆</div>
            <h3 style="font-size:1.5rem; margin:6px 0;">Examen Simulado de Español (Medio Parcial)</h3>
            <p style="color:var(--muted); font-weight:700; max-width:560px; margin:0 auto 14px;">
              ¡Demuestra todo lo que aprendiste de sílabas T, D, R, oraciones, inversas y La rana saltarina! Logra 80% o más para ganar tu diploma imprimible.
            </p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;">
              <button type="button" class="primary-action" onclick="startEsMockExam(22)">📝 Examen Completo (22 Preguntas)</button>
              <button type="button" class="secondary-action" onclick="startEsMockExam(10)">⚡ Repaso Rápido (10 Preguntas)</button>
            </div>
          </div>
        `;
        return;
      }

      if (ex.idx >= ex.list.length) {
        ex.active = false;
        const total = ex.results.length;
        const right = ex.results.filter(r => r.ok).length;
        const pct = Math.round((right / total) * 100);
        const missed = ex.results.filter(r => !r.ok);
        if (pct >= 80) { MobileAudioEngine.playSuccessChime(); launchConfetti(75); markProgress("spanish", null, false, 6); }

        box.innerHTML = `
          <div style="text-align:center;">
            <h3 style="font-size:1.55rem;">🎉 Calificación en Español: ${right} / ${total} (${pct}%)!</h3>
            <p style="color:var(--muted); font-weight:700;">${missed.length === 0 ? "¡100% Perfecto, Sol! ¡Estás súper lista para tu examen de Español!" : `Repasa las ${missed.length} pregunta(s) marcada(s) abajo para llegar al 100%.`}</p>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:12px 0;">
              ${missed.length ? `<button type="button" class="primary-action" onclick="retryEsMissedExam()">🔄 Repetir Errores (${missed.length})</button>` : ""}
              <button type="button" class="secondary-action" onclick="renderEsMockExamUI()">Volver al Menú del Examen</button>
            </div>
          </div>
          <table class="ref-table">
            <thead><tr><th>Pregunta</th><th>Respuesta de Sol</th><th>Revisión</th></tr></thead>
            <tbody>
              ${ex.results.map((r, i) => `
                <tr>
                  <td><strong>${i + 1}.</strong> ${escapeHTML(r.q.prompt)}</td>
                  <td>${escapeHTML(r.solAns)}</td>
                  <td>${r.ok ? "✅ ¡Correcto!" : `❌ ${escapeHTML(r.correctAns)}<br/><small>${escapeHTML(r.q.tip)}</small>`}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
          ${pct >= 80 ? `
            <div class="certificate">
              <h3>🌟 Certificado Oficial de Súper Lectora y Escritora 🌟</h3>
              <p style="font-size:1.15rem; font-weight:800; margin:10px 0;">Otorgado a <strong>SOL</strong> por obtener <strong>${right} / ${total} (${pct}%)</strong> en su Repaso de Español de Primer Grado.</p>
              <button type="button" class="secondary-action" onclick="window.print()">🖨️ Imprimir Diploma</button>
            </div>
          ` : ""}
        `;
        renderReadinessGrid("esReadinessMap", "spanish");
        return;
      }

      const q = ex.list[ex.idx];
      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:800; color:var(--muted); margin-bottom:10px;">
          <span>Pregunta ${ex.idx + 1} de ${ex.list.length}</span>
          <span>🇪🇸 Examen de Español</span>
        </div>
        ${q.photoKey ? `<div class="stage-photo">${renderVisualBox(q.photoKey, "", false)}</div>` : ""}
        <div class="prompt-banner">
          <div>${escapeHTML(q.prompt)}</div>
          <div style="margin-top:8px;">
            ${speakBtnHTML(q.audio, "es", "🔊 Escuchar")}
            ${speakBtnHTML(q.audio, "es", "🐢 Despacito", true, "btn-slow")}
          </div>
        </div>
        ${q.type === "choice" ? `
          <div class="choices-grid">
            ${q.opts.map((o, oi) => `<button type="button" class="choice-tile" style="font-size:1.08rem;" onclick="submitEsExamChoice(${oi})">${escapeHTML(o)}</button>`).join("")}
          </div>
        ` : `
          <div class="spell-input-wrap">
            <input id="esExamTypeInput" class="spell-text-input" type="text" placeholder="escribe la palabra…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter') submitEsExamType()" />
            <div class="accent-keyboard">
              ${["á","é","í","ó","ú","ñ"].map(ch => `<button type="button" class="accent-key" onclick="insertAccentChar('esExamTypeInput','${ch}')">${ch}</button>`).join("")}
            </div>
            <button type="button" class="primary-action" onclick="submitEsExamType()">Enviar y Siguiente ➡️</button>
          </div>
        `}
      `;
    }

    function submitEsExamChoice(oi) {
      const ex = appState.esExam;
      const q = ex.list[ex.idx];
      const ok = oi === q.ans;
      ex.results.push({ q, solAns: q.opts[oi], correctAns: q.opts[q.ans], ok });
      if (ok) { MobileAudioEngine.playTone(784, 0.11); markProgress("spanish", q.id, true, 0); }
      else { MobileAudioEngine.playTryAgainSound(); markMissed("spanish", q.id); }
      ex.idx++;
      renderEsMockExamUI();
      if (ex.idx < ex.list.length) MobileAudioEngine.speak(ex.list[ex.idx].audio, "es");
    }

    function submitEsExamType() {
      const ex = appState.esExam;
      const q = ex.list[ex.idx];
      const val = (document.getElementById("esExamTypeInput")?.value || "").trim().toLowerCase();
      const ok = normalizeText(val) === normalizeText(q.ansWord);
      ex.results.push({ q, solAns: val || "(vacío)", correctAns: q.ansWord, ok });
      if (ok) { MobileAudioEngine.playTone(784, 0.11); markProgress("spanish", q.id, true, 0); }
      else { MobileAudioEngine.playTryAgainSound(); markMissed("spanish", q.id); }
      ex.idx++;
      renderEsMockExamUI();
      if (ex.idx < ex.list.length) MobileAudioEngine.speak(ex.list[ex.idx].audio, "es");
    }

    function retryEsMissedExam() {
      const missed = appState.esExam.results.filter(r => !r.ok).map(r => r.q);
      if (!missed.length) return;
      appState.esExam = { active: true, list: shuffle(missed), idx: 0, results: [] };
      renderEsMockExamUI();
      MobileAudioEngine.speak(appState.esExam.list[0].audio, "es");
    }

    function renderReadinessGrid(containerId, guide) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const items = guide === "reading" ? getReadingTrackables() : getSpanishTrackables();
      const b = progress[guide];
      el.innerHTML = items.map(it => {
        const mast = !!b.mastered[it.id];
        const miss = !!b.missed[it.id];
        const learn = !!b.learned[it.id] || !!b.ccq[it.id];
        const cls = mast ? "done" : miss ? "missed" : learn ? "partial" : "";
        const icon = mast ? "⭐" : miss ? "🔄" : learn ? "🌤️" : "🌱";
        return `<div class="tracker-pill ${cls}">${icon} ${escapeHTML(it.label)}</div>`;
      }).join("");
    }

    /* =========================================================================
       13. CONFETTI CELEBRATION ENGINE & BOOT INITIALIZATION
       ========================================================================= */
    function launchConfetti(count = 40) {
      const canvas = document.getElementById("confettiLayer");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ["#ff6b6b", "#fcc419", "#51cf66", "#339af0", "#845ef7"];
      const parts = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 120,
        vx: (Math.random() - 0.5) * 4,
        vy: 3 + Math.random() * 4,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI
      }));
      let f = 0;
      function tick() {
        f++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.rot += 0.1;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });
        if (f < 105) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      tick();
    }

    (function bootApp() {
      document.body.classList.toggle("parent-cue-on", !!prefs.parentCue);
      MobileAudioEngine.init();
      renderChrome();
      renderMainApp();
      loadAllPexelsPhotos();
    })();
  </script>

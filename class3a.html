function poss(s){if(s==='I')return'my';if(s==='You')return'your';if(s==='He'||s==='Dad')return'his';if(s==='We')return'our';if(s==='They')return'their';return'her';}

  if(S.bPol==='-'&&fq.id==='never')fq=fqObj('usually');
  var hasF=(fq.id!=='none'),T=[],txt='';
  if(S.track==='do'){
    var ps=poss(sub),aux=is3p(sub)?'does':'do',neg=is3p(sub)?"doesn't":"don't",vb=is3p(sub)?it.v3:it.v,ob=((is3p(sub)&&it.obj3)?it.obj3:it.obj).replace(/\{pos\} phone/g,(sub==='We'||sub==='They')?ps+' phones':ps+' phone').replace(/\{pos\}/g,ps);
    if(S.bPol==='+'){
      T.push({c:'i',t:sub});if(hasF&&!fq.end)T.push({c:'f',t:fq.lbl});
      T.push({c:'v',t:vb});T.push({c:it.oc,t:ob+(hasF&&fq.end?'':'.')});
      if(hasF&&fq.end)T.push({c:'f',t:fq.lbl+'.'});

    }else if(S.bPol==='-'){
      T.push({c:'i',t:sub},{c:'v',t:neg});if(hasF&&!fq.end)T.push({c:'f',t:fq.lbl});
      T.push({c:'v',t:it.v},{c:it.oc,t:ob+(hasF&&fq.end?'':'.')});
      if(hasF&&fq.end)T.push({c:'f',t:fq.lbl+'.'});
      txt=T.map(function(x){return x.t;}).join(' ');
    }else if(S.bPol==='?'){
      T.push({c:'v',t:cap(aux)},{c:'i',t:s});if(hasF&&!fq.end)T.push({c:'f',t:fq.lbl});
      T.push({c:'v',t:it.v},{c:it.oc,t:ob+(hasF&&fq.end?'':'?')});
      if(hasF&&fq.end)T.push({c:'f',t:fq.lbl+'?'});

    }else{
      var tp=it.wh[S.bWh].replace(/\{pos\} phone/g,(sub==='We'||sub==='They')?ps+' phones':ps+' phone').replace(/\{pos\}/g,ps);txt=tp.replace('{aux}',aux).replace('{s}',s);
      var m=tp.match(/^(.*?)\s*\{aux\}\s*\{s\}\s*(.*)$/),rs=m[2].replace(/\?$/,'');
      T=[{c:'c',t:m[1]},{c:'v',t:aux},{c:'i',t:s}];

      var curS=SPY_DAYS[S.spyCard]||SPY_DAYS[0],sOk=(arg===curS.day);
      S.spyGuess=arg;S.spyResult=sOk?'right':'wrong';
      if(sOk){S.spyWins=Math.min(2,S.spyWins+1);chime('done');burst();}else chime('err');
      S.spyHidden=false;S.spyPeekEnd=0;stopPeek();render();break;
    case 'spynext':S.spyRound=2;dealSpy();render();break;

    case 'swapstage':if(arg!=='interview')stopT();S.swapStage=arg;render();break;
    case 'swapkw':var kp=arg.indexOf(':'),wn=parseInt(arg.slice(0,kp),10),kw=arg.slice(kp+1);tog(wn===1?S.swapQ1:S.swapQ2,kw,4);chime('good');render();break;
    case 'timertog':if(S.timerRun)stopT();else startT();render();break;
    case 'timerreset':stopT();S.timerLeft=TIMER_LEN;render();break;
    case 'swapturn':stopT();S.timerLeft=TIMER_LEN;S.swapTurn=(S.swapTurn===1?2:1);render();break;
    case 'wmode':S.wMode=arg;render();break;
    case 'nbchk':tog(S.nbChecks,arg);chime(S.nbChecks.length===4?'done':'good');render();break;
    case 'swapver':var vp=arg.split(':');if(vp[0]==='1')S.swapVer1=vp[1];else S.swapVer2=vp[1];chime('good');render();break;

    case 'fillnotes':S.stars[0]=S.notes.stars[0]||'';S.stars[1]=S.notes.stars[1]||'';for(var ni=0;ni<3;ni++)S.upgrades[ni]={bad:(S.notes.ups[ni]||''),fixed:'',done:false};render();break;
    case 'fillexamples':
      S.stars=[p1()+' always gets up at 6:30 on weekdays because school is early!',p2()+' often studies after school, and on Saturdays she wants to sleep in!'];
      S.upgrades=[{bad:'I get up always at 7:00.',fixed:'',done:false},{bad:'She goes to the school in 7:15.',fixed:'',done:false},{bad:'We want sleep in because is relaxing.',fixed:'',done:false}];
      render();break;
    case 'saystar':speak(S.stars[parseInt(arg,10)]||'',spid);break;
    case 'upgdone':
      var ui=parseInt(arg,10);if(!S.upgrades[ui].done&&!S.upgrades[ui].fixed.trim()){toast('Type the fixed sentence first!');break;}
      S.upgrades[ui].done=!S.upgrades[ui].done;if(S.upgrades[ui].done)chime('good');render();break;
    case 'ratea':S.rateA=parseInt(arg,10);chime('good');render();break;
    case 'rateb':S.rateB=parseInt(arg,10);chime('good');render();break;
    case 'candoa':tog(S.canA,parseInt(arg,10));chime('good');render();break;
    case 'candob':tog(S.canB,parseInt(arg,10));chime('good');render();break;
    case 'copyhw':copyTxt(missionTxt(),function(ok){S.hwCopied=ok;S.hwFail=!ok;if(ok)chime('done');render();});break;
    case 'sharehw':if(navigator.share)navigator.share({title:'BAA Class 3 Mission',text:missionTxt()}).catch(function(){});break;

    case 'topen':popOpen=false;tOpen=!tOpen;updChr();break;
    case 'tclose':tOpen=false;renderTeacher();break;
    case 'ttab':S.tTab=arg;save();renderTeacher();break;
    case 'tpin':S.teacher=!S.teacher;save();renderTeacher();break;
    case 'tclock':if(S.clkT0){S.clkAcc+=(Date.now()-S.clkT0);S.clkT0=0;}else S.clkT0=Date.now();save();renderTeacher();break;
    case 'tclockreset':S.clkAcc=0;S.clkT0=0;save();renderTeacher();break;
    case 'taddstar':var ti=document.getElementById('tNoteInput');if(ti&&ti.value.trim()){if(S.notes.stars.length>=10)S.notes.stars.shift();S.notes.stars.push(ti.value.trim());ti.value='';save();renderTeacher();}break;
    case 'taddup':var ti2=document.getElementById('tNoteInput');if(ti2&&ti2.value.trim()){if(S.notes.ups.length>=10)S.notes.ups.shift();S.notes.ups.push(ti2.value.trim());ti2.value='';save();renderTeacher();}break;
    case 'tdelstar':S.notes.stars.splice(parseInt(arg,10),1);save();renderTeacher();break;
    case 'tdelup':S.notes.ups.splice(parseInt(arg,10),1);save();renderTeacher();break;
  }
}

document.addEventListener('click',function(e){
  if(e.target&&e.target.closest&&e.target.closest('a'))return;
  if(popOpen){
    var inp=e.target.closest&&e.target.closest('#settingsPop'),onp=e.target.closest&&e.target.closest('[data-act="pop"]');
    if(!inp&&!onp){popOpen=false;var pE=document.getElementById('settingsPop'),pB=document.getElementById('popBtn');if(pE)pE.classList.remove('open');if(pB)pB.setAttribute('aria-expanded','false');}
  }
  if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-act')==='tbackdrop'){tOpen=false;renderTeacher();return;}
  var el=e.target.closest('[data-act]');if(el&&el.getAttribute('data-act')!=='tbackdrop')act(el);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(tOpen){tOpen=false;renderTeacher();return;}if(popOpen){popOpen=false;updChr();return;}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='n1'){S.s1=t.value;updHdr();save();}
  else if(t.id==='n2'){S.s2=t.value;updHdr();save();}
  else if(t.hasAttribute('data-ret')){S.retIn[parseInt(t.getAttribute('data-ret'),10)]=t.value;save();}
  else if(t.hasAttribute('data-bugin')){S.bugTyped[parseInt(t.getAttribute('data-bugin'),10)]=t.value;save();}
  else if(t.id==='spyQInput'){S.spyQ=t.value;save();}
  else if(t.id==='spyEvIn'){
    var prevOk=S.spyEv.trim().length>=8;S.spyEv=t.value;var nowOk=S.spyEv.trim().length>=8;save();
    if(prevOk!==nowOk){var bs=document.querySelectorAll('[data-act="spyguess"]');for(var i=0;i<bs.length;i++)bs[i].disabled=!nowOk;}
  }
  else if(t.id==='swapNotes'){if(S.swapTurn===1)S.swapNotes1=t.value;else S.swapNotes2=t.value;save();}
  else if(t.id==='nbSelfInput'){S.nbSelf=t.value;save();}
  else if(t.id==='nbPartnerInput'){S.nbPartner=t.value;save();}
  else if(t.id==='nbParaInput'){S.nbPara=t.value;save();}
  else if(t.id==='exitAInput'){S.exitA=t.value;save();}
  else if(t.id==='exitBInput'){S.exitB=t.value;save();}
  else if(t.id==='tDeliverInput'){S.deliverTo=t.value;save();}
  else if(t.hasAttribute('data-star')){S.stars[parseInt(t.getAttribute('data-star'),10)]=t.value;save();}
  else if(t.hasAttribute('data-upgbad')){S.upgrades[parseInt(t.getAttribute('data-upgbad'),10)].bad=t.value;save();}
  else if(t.hasAttribute('data-upgfix')){S.upgrades[parseInt(t.getAttribute('data-upgfix'),10)].fixed=t.value;save();}
});
document.addEventListener('focusin',function(e){if(e.target.matches&&e.target.matches('input[type=text],textarea'))document.body.classList.add('typing');});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!(a&&a.matches&&a.matches('input[type=text],textarea')))document.body.classList.remove('typing');},60);});
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(S.timerRun)tickT();if(!S.spyHidden&&S.spyPeekEnd)tickPeek();}});

render({anim:true});
})();
</script>
</body>
</html>

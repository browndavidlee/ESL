<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f213d">
<meta name="robots" content="noindex">
<title>Brown American Academy - English Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f213d;--coral:#b93626;--coral-d:#99291b;--coral-s:#fff1ef;--emerald:#047857;--emerald-s:#ecfdf5;--sky:#1d4ed8;--sky-s:#eff6ff;--amber:#b45309;--amber-s:#fef6e6;--bg:#f4f7fb;--text:#1e293b;--muted:#475569;--border:#cbd5e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0f213d,#17315a);color:#fff;padding:10px 14px 10px;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:var(--coral);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{display:block;font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;max-width:960px;margin:8px auto 0}
.dot{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.28)}
.dot.done{background:#fff}
.dot.now{background:#fca5a5}

.wrap{max-width:960px;margin:0 auto;padding:12px 12px 120px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(15,33,61,.08);margin-bottom:14px}
h2{margin:0 0 4px;color:var(--navy);font-size:clamp(22px,6vw,30px);line-height:1.2}
h3{margin:16px 0 8px;color:var(--navy);font-size:19px}
.sub{margin:0 0 10px;color:var(--muted);font-size:15px}
.mt{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.lbl{display:block;font-weight:700;font-size:15px;color:var(--navy);margin:8px 0 6px}
input[type=text]{font-family:inherit;font-size:16px;padding:12px 14px;min-height:48px;border-radius:12px;border:1.5px solid var(--border);width:100%;color:var(--text);background:#fff}

.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.pri{background:var(--coral);color:#fff}.pri:hover{background:var(--coral-d)}
.sky{background:var(--sky);color:#fff}
.em{background:var(--emerald);color:#fff}
.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
.chip{border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;min-height:44px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.yes.on{background:var(--emerald);border-color:var(--emerald)}
.chip.no.on{background:var(--coral);border-color:var(--coral)}
.slow{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;min-height:40px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
.slow.on{background:#fff;color:var(--navy)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}}
.vc{border:2px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer}
.vc:active{border-color:var(--sky)}
.vb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.vw{font-size:18px;font-weight:800;color:var(--navy);line-height:1.2}
.vh{font-size:14px;font-weight:700;color:var(--sky)}

.img{position:relative;background:linear-gradient(135deg,#eff6ff,#fef3c7);overflow:hidden;width:100%}
.img.r43{aspect-ratio:4/3}
.img.r1610{aspect-ratio:16/10}
.img.r1{aspect-ratio:4/3}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fb{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;font-size:22px;color:var(--navy)}
.credit{position:absolute;left:6px;right:6px;bottom:6px;font-size:11px;color:#fff;background:rgba(15,23,42,.82);padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:#fff}

.banner{background:#f8fafc;border:2px dashed #94a3b8;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.tok{padding:8px 12px;border-radius:10px;font-weight:800;font-size:18px;font-family:inherit;border:2px solid transparent;display:inline-flex;align-items:center;min-height:44px;background:#f1f5f9;color:var(--navy)}
button.tok{cursor:pointer}
.tok.i{background:#d1fae5;color:#065f46;border-color:#059669;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tok.v{background:#dbeafe;color:#1e3a8a;border-color:#3b82f6;font-style:italic}
.tok.n{background:#fee2e2;color:#991b1b;border-color:#ef4444}
.tok.c{background:#fef3c7;color:#78350f;border-color:#d97706}
.profile{background:linear-gradient(135deg,#0f213d,#1e3a6d);border-radius:18px;padding:12px;margin:12px 0}
.profile .banner{margin:0;background:rgba(255,255,255,.97);border:0}

.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:12px 0}
@media (max-width:560px){.duel{grid-template-columns:1fr}}
.or{font-weight:900;font-size:22px;color:var(--coral);text-align:center}
.dc{border:3px solid var(--border);border-radius:20px;overflow:hidden;background:#fff;cursor:pointer}
.dc.sel{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(4,120,87,.25)}
.dc .vb{align-items:flex-start}
.dc .pick{font-weight:800;color:var(--emerald);font-size:16px;min-height:22px}

.melike{background:linear-gradient(135deg,#047857,#065f46);color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:800;font-size:18px}
.melike .btn{background:rgba(255,255,255,.2);color:#fff}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.pc{border:2px solid var(--border);border-radius:20px;padding:12px;background:linear-gradient(180deg,#fff,#f8fafc)}
.pc.me{border-top:6px solid #6d28d9}
.pc.fr{border-top:6px solid var(--sky)}
.pn{font-size:20px;color:var(--navy)}
.sent{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;font-size:17px;font-weight:700;color:var(--navy)}
.sent.faded .txt{visibility:hidden}
.sent u.i{text-decoration-thickness:3px;color:#065f46;font-weight:800}
.sent .n{color:#991b1b}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.thumbs img{width:52px;height:40px;object-fit:cover;border-radius:6px;display:block}
.thumbs .tag{background:#e2e8f0;border-radius:8px;padding:4px 8px;font-weight:700;font-size:13px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.mc{border:2px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;text-align:center;cursor:pointer}
.mc.on{border-color:var(--emerald);background:var(--emerald-s);box-shadow:0 0 0 2px rgba(4,120,87,.25)}
.mc img,.mc .ph{width:100%;height:68px;object-fit:cover;display:grid;place-items:center;font-weight:700;font-size:13px;background:#f1f5f9}
.mc span{display:block;padding:6px 4px;font-size:14px;font-weight:700;color:var(--navy)}

.qbox{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.qbox .q{font-weight:800;color:var(--navy);font-size:16px;margin-bottom:8px}
.qbox .q span{color:var(--muted);font-weight:600}
.hint{background:var(--amber-s);border:1.5px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));display:flex;gap:10px;justify-content:center}
.nav .btn{flex:1;max-width:420px;min-height:52px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:4px 12px 0}
footer a{color:var(--navy);font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">BAA</div><div><b>Brown American Academy</b><small>English Class</small></div></div>
    <button class="slow" id="slowBtn" data-act="slow" aria-pressed="false">Slow voice: Off</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
</header>

<main class="wrap">
  <div id="app" aria-live="polite"></div>
  <footer>Photos provided by <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a></footer>
</main>

<nav class="nav">
  <button class="btn ghost" id="backBtn" data-act="back">Back</button>
  <button class="btn pri" id="nextBtn" data-act="next">Next</button>
</nav>

function pickVoice(lang){
  var l = lang.toLowerCase(), b = l.slice(0,2);
  var pref = /Samantha|Ava|Allison|Aria|Jenny|Google US English|Paulina|Monica|Sabina|Google espa/i;
  var ex = voices.filter(function(v){ return (v.lang||'').replace('_','-').toLowerCase()===l; });
  var ba = voices.filter(function(v){ return (v.lang||'').toLowerCase().indexOf(b)===0; });
  return ex.filter(function(v){return pref.test(v.name);})[0] || ex[0] || ba.filter(function(v){return pref.test(v.name);})[0] || ba[0] || null;
}
function speak(text, lang){
  if(!('speechSynthesis' in window) || !text) return;
  var ss = window.speechSynthesis;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  var v = pickVoice(u.lang); if(v) u.voice = v;
  u.rate = S.slow ? 0.7 : 0.9;
  if(ss.speaking || ss.pending){ ss.cancel(); setTimeout(function(){ ss.speak(u); }, 60); }
  else { ss.speak(u); }
}

    h += '<div class="melike"><span>I like '+esc(V[vote].w)+'!</span><button class="btn sm" data-act="say" data-arg="'+esc('I like '+V[vote].w+'!')+'">Listen</button></div>';
  } else if(lvl===0){
    h += '<div class="banner" style="justify-content:center"><span class="tok i">I</span><span class="tok v">like</span><span class="tok n">'+esc(V[d[0]].w)+' / '+esc(V[d[1]].w)+'</span><span class="tok c">Me too!</span></div>';
  } else if(lvl===1){
    h += '<div class="banner" style="justify-content:center"><span class="tok i">I</span><span class="tok v">...</span><span class="tok n">...</span></div>';
  }
  h += '<div class="row" style="justify-content:space-between">'+
    '<button class="btn ghost" data-act="duelnav" data-arg="-1"'+(i===0?' disabled':'')+'>Previous pair</button>'+
    '<button class="btn em" data-act="duelnav" data-arg="1"'+(i===DUELS.length-1?' disabled':'')+'>Next pair</button></div>';
  h += '</div>';
  return h;
}

/* ---------- step 3: connection cards ---------- */
function pool(){
  var core = ['music','pizza','chocolate'], tally = {};
  DUELS.forEach(function(d,i){ var id = S.votes[i]; if(id) tally[id] = (tally[id]||0)+1; });
  var ranked = Object.keys(tally).filter(function(id){ return core.indexOf(id)<0; });
  return core.concat(ranked).slice(0,6);
}
function seedMine(){
  if(S.mineTouched) return;
  var p = pool();
  S.mine = uniq(DUELS.map(function(d,i){ return S.votes[i]; }).filter(function(id){ return id && p.indexOf(id)>=0; })).slice(0,3);
}
function likeText(ids){ return ids.length ? 'I like '+joinAnd(words(ids))+'.' : 'I like ...'; }
function sentHtml(name, ids){
  return 'Hello! <u class="i">I</u> <em>am</em> '+esc(name||'...')+'. <u class="i">I</u> <em>am from</em> <span lang="es">Comayagua</span>. <u class="i">I</u> <em>like</em> <span class="n">'+esc(ids.length?joinAnd(words(ids)):'...')+'</span>.';
}
function thumbs(ids){
  var h = '';
  var cp = PHOTOS.comayagua;
  h += cp ? '<img src="'+esc(cp.url)+'" alt="Comayagua" loading="lazy" onerror="this.remove()">' : '<span class="tag" lang="es">Comayagua</span>';
  ids.forEach(function(id){
    var p = PHOTOS[id];
    h += p ? '<img src="'+esc(p.url)+'" alt="'+esc(V[id].w)+'" loading="lazy" onerror="this.remove()">' : '<span class="tag">'+esc(V[id].w)+'</span>';
  });
  return h;
}
function pcard(who){
  var me = who==='me', ids = me ? S.mine : S.friend;
  var name = me ? (nm()||'Me') : ((S.friendName||'').trim()||'My friend');
  var spoken = 'Hello! I am '+name+'. I am from Comayagua. '+likeText(ids);
  var h = '<div class="pc '+who+'"><div class="between">';
  h += me ? '<strong class="pn">'+esc(name)+'</strong>'
          : '<input id="fn" type="text" maxlength="30" style="flex:1;min-width:0" value="'+esc(S.friendName)+'" placeholder="Friend&#39;s name">';
  h += '<button class="btn sm sky" data-act="say" data-arg="'+esc(spoken)+'">Listen</button></div>';
  h += '<div class="sent'+(S.fade?' faded':'')+'"><div class="txt"'+(S.fade?' aria-hidden="true"':'')+'>'+sentHtml(name,ids)+'</div>';
  h += '<div class="thumbs">'+thumbs(ids)+'</div></div>';
  h += '<div class="minis">'+pool().map(function(id){
    var on = ids.indexOf(id)>=0, p = PHOTOS[id];
    return '<div class="mc'+(on?' on':'')+'" role="button" tabindex="0" aria-pressed="'+(on?'true':'false')+'" data-act="'+(me?'mine':'fr')+'" data-arg="'+id+'">'+
      (p ? '<img src="'+esc(p.url)+'" alt="" loading="lazy" onerror="this.remove()">' : '<div class="ph">'+esc(V[id].w)+'</div>')+
      '<span>'+(on?'Selected: ':'')+esc(V[id].w)+'</span></div>';
  }).join('')+'</div></div>';
  return h;
}
function s3(){
  var matches = S.mine.filter(function(id){ return S.friend.indexOf(id)>=0; });
  var h = '<div class="card"><div class="between"><h2>Comayagua Connection Cards</h2>'+
    '<button class="btn sm '+(S.fade?'pri':'ghost')+'" data-act="fade">'+(S.fade?'Show the words':'Hide the words')+'</button></div>';
  h += '<p class="sub">Pick 2 or 3 pictures for each card. Say your card to a friend. Do you both like the same thing? Say: Me too!</p>';
  if(matches.length){
    var say = 'Me too! We both like '+joinAnd(words(matches))+'!';
    h += '<div class="melike"><span>ME TOO! '+esc(words(matches).join(' / '))+'</span><button class="btn sm" data-act="say" data-arg="'+esc(say)+'">Listen</button></div>';
  } else {
    h += '<div class="hint">When you and your friend pick the same picture, you will see ME TOO!</div>';
  }
  h += '<div class="two">'+pcard('me')+pcard('fr')+'</div></div>';
  return h;
}

/* ---------- step 4: goodbye ---------- */
function chips(list, key){
  return list.map(function(o){
    return '<button class="chip'+(S[key]===o?' on':'')+'" data-act="intake" data-arg="'+key+':'+esc(o)+'">'+esc(o)+'</button>';
  }).join('');
}
function s4(){
  var name = nm() || '...';
  var sentence = 'Hello! I am '+name+'. I am from Comayagua. '+likeText(S.mine);
  var h = '<div class="card"><div class="between"><h2>Great Job Today!</h2>'+
    '<button class="btn em sm" data-act="say" data-arg="Amazing job today! Goodbye! See you in Class 2!">Listen: Goodbye!</button></div>';
  h += '<div style="background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:14px;margin:12px 0">'+
    '<h3 style="margin:0 0 8px;color:#065f46">Your English</h3>'+
    '<div class="sent" style="margin:0 0 10px">'+sentHtml(nm(), S.mine)+'</div>'+
    '<button class="btn sky sm" data-act="say" data-arg="'+esc(sentence)+'">Listen to my sentence</button></div>';
  h += '<h3>Your Class 2 Picks</h3>';
  h += '<div class="qbox"><div class="q">1. Why English? <span lang="es">&iquest;Por qu&eacute; quieres aprender ingl&eacute;s?</span></div><div class="row">'+chips(GOALS,'goal')+'</div></div>';
  h += '<div class="qbox"><div class="q">2. Class 2 topic? <span lang="es">&iquest;Tema favorito para la Clase 2?</span></div><div class="row">'+chips(TOPICS,'topic')+'</div></div>';
  h += '<p class="sub mt">Goodbye! See you in Class 2 at Brown American Academy!</p></div>';
  return h;
}

/* ---------- chrome ---------- */
function updateChrome(){
  var d = document.getElementById('dots'), h = '';
  for(var i=0;i<STEPS.length;i++){ h += '<div class="dot'+(i<S.step?' done':(i===S.step?' now':''))+'"></div>'; }
  d.innerHTML = h;
  var back = document.getElementById('backBtn'), next = document.getElementById('nextBtn');
  back.disabled = S.step===0;
  if(S.step < STEPS.length-1){ next.textContent = 'Next: '+STEPS[S.step+1]; next.setAttribute('data-act','next'); }
  else { next.textContent = 'Start again'; next.setAttribute('data-act','restart'); }
  var sb = document.getElementById('slowBtn');
  sb.textContent = 'Slow voice: '+(S.slow?'On':'Off');
  sb.classList.toggle('on', !!S.slow);
  sb.setAttribute('aria-pressed', S.slow?'true':'false');
}
function render(){
  app.innerHTML = [s0,s1,s2,s3,s4][S.step]();
  updateChrome();
  save();
}
function goStep(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  if(n===3) seedMine();
  S.step = n;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  render();
  window.scrollTo(0,0);
}
function toggle(list, id){
  var i = list.indexOf(id);
  if(i>=0) list.splice(i,1);
  else { if(list.length>=3) list.shift(); list.push(id); }
}

/* ---------- events ---------- */
function act(el){
  var a = el.getAttribute('data-act'), arg = el.getAttribute('data-arg') || '';
  switch(a){
    case 'say': speak(arg, el.getAttribute('data-lang') || 'en-US'); break;
    case 'next': goStep(S.step+1); break;
    case 'back': goStep(S.step-1); break;
    case 'restart':
      S = {step:0,name:'',yn:{},duel:0,votes:{},mine:[],mineTouched:false,friendName:'',friend:[],fade:false,goal:'',topic:'',slow:S.slow};
      render(); window.scrollTo(0,0); break;
    case 'slow': S.slow = !S.slow; updateChrome(); save(); break;
    case 'yn': var p = arg.split(':'); S.yn[p[0]] = p[1]; render(); break;
    case 'pick': S.votes[S.duel] = arg; render(); speak('I like '+V[arg].w+'!'); break;
    case 'duelnav': S.duel = Math.max(0, Math.min(DUELS.length-1, S.duel + parseInt(arg,10))); render(); break;
    case 'mine': toggle(S.mine, arg); S.mineTouched = true; render(); break;
    case 'fr': toggle(S.friend, arg); render(); break;
    case 'fade': S.fade = !S.fade; render(); break;
    case 'intake': var k = arg.indexOf(':'); S[arg.slice(0,k)] = arg.slice(k+1); render(); break;
  }
}
document.addEventListener('click', function(e){
  if(e.target.closest('a')) return;
  var el = e.target.closest('[data-act]');
  if(el) act(el);
});
document.addEventListener('keydown', function(e){
  if((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role="button"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', function(e){
  if(e.target.id==='nm'){ S.name = e.target.value; save(); }
  if(e.target.id==='fn'){ S.friendName = e.target.value; save(); }
});

render();
})();
</script>
</body>
</html>

<style>
:root{
  --navy:#0f213d;--navy-2:#17315a;--coral:#b93626;--coral-d:#99291b;--coral-s:#fff1ef;
  --emerald:#047857;--emerald-s:#ecfdf5;--sky:#1d4ed8;--sky-s:#eff6ff;
  --amber:#b45309;--amber-s:#fef6e6;--purple:#6d28d9;--purple-s:#f5f3ff;
  --bg:#f4f7fb;--text:#1e293b;--muted:#475569;--border:#cbd5e1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;touch-action:manipulation}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Header */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:var(--coral);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{display:block;font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill-bar{display:inline-flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:2px;gap:2px}
.pill-bar button{border:0;background:transparent;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;cursor:pointer;min-height:34px}
.pill-bar button.on{background:#fff;color:var(--navy)}
.slow{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 11px;min-height:38px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}
.slow.on{background:#fff;color:var(--navy)}
.dots{display:flex;gap:6px;max-width:980px;margin:8px auto 0}
.dot{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.26);cursor:pointer;border:0;padding:0}
.dot.done{background:#fff}
.dot.now{background:#fca5a5}

/* Layout & Typography */
.wrap{max-width:980px;margin:0 auto;padding:12px 12px 124px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(15,33,61,.07);margin-bottom:14px}
h2{margin:0 0 4px;color:var(--navy);font-size:clamp(21px,5vw,28px);line-height:1.2}
h3{margin:16px 0 8px;color:var(--navy);font-size:18px}
.sub{margin:0 0 10px;color:var(--muted);font-size:15px}
.mt{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:720px){.two,.three{grid-template-columns:1fr}}

/* Badges & Stage Tag */
.stage-tag{display:inline-flex;align-items:center;gap:6px;background:var(--sky-s);color:var(--sky);border:1px solid #bfdbfe;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.02em}
.cefr-tag{display:inline-flex;align-items:center;background:var(--purple-s);color:var(--purple);border:1px solid #ddd6fe;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}

/* Inputs & Buttons */
.lbl{display:block;font-weight:700;font-size:14px;color:var(--navy);margin:6px 0 4px}
input[type=text],textarea{font-family:inherit;font-size:16px;padding:10px 13px;min-height:46px;border-radius:12px;border:1.5px solid var(--border);width:100%;color:var(--text);background:#fff}
textarea{min-height:76px;resize:vertical}
.btn{border:0;border-radius:12px;padding:11px 16px;min-height:48px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13px;border-radius:10px}
.pri{background:var(--coral);color:#fff}.pri:hover{background:var(--coral-d)}
.sky{background:var(--sky);color:#fff}
.em{background:var(--emerald);color:#fff}
.purp{background:var(--purple);color:#fff}
.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
.chip{border:1.5px solid var(--border);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;min-height:42px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.yes.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.chip.no.on{background:var(--coral);border-color:var(--coral);color:#fff}
.chip.meh.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* Grammar Color Tokens */
.banner{background:#f8fafc;border:2px dashed #94a3b8;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.tok{padding:7px 11px;border-radius:10px;font-weight:800;font-size:16px;font-family:inherit;border:2px solid transparent;display:inline-flex;align-items:center;min-height:40px;background:#f1f5f9;color:var(--navy)}
button.tok{cursor:pointer}
.tok.i{background:#d1fae5;color:#065f46;border-color:#059669;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tok.v{background:#dbeafe;color:#1e3a8a;border-color:#3b82f6;font-style:italic}
.tok.n{background:#fee2e2;color:#991b1b;border-color:#ef4444}
.tok.c{background:#fef3c7;color:#78350f;border-color:#d97706}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.legend .tok{font-size:12px;min-height:28px;padding:3px 9px}

/* Cards & Visuals */
.pbox{border:2px solid var(--border);border-radius:16px;padding:12px;background:#fff}
.pbox.a{border-top:5px solid var(--purple)}
.pbox.b{border-top:5px solid var(--sky)}
.art-box{display:grid;place-items:center;background:linear-gradient(135deg,#eff6ff,#fef3c7);border-radius:14px;padding:12px;min-height:118px;position:relative}
.art-box svg{width:76px;height:76px;display:block}
.match-banner{background:linear-gradient(135deg,#047857,#065f46);color:#fff;border-radius:16px;padding:12px 16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:800;font-size:16px}
.match-banner .btn{background:rgba(255,255,255,.22);color:#fff}
.hint-box{background:var(--amber-s);border:1.5px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:#78350f;font-weight:600}
.ok-box{background:var(--emerald-s);border:1.5px solid var(--emerald);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:#065f46;font-weight:700}

/* Chat Bubbles */
.chat-wrap{display:flex;flex-direction:column;gap:10px;background:#f8fafc;border:1.5px solid var(--border);border-radius:16px;padding:14px;margin:10px 0}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;cursor:pointer;border:1.5px solid transparent;transition:transform .1s}
.bub:active{transform:scale(.99)}
.bub.l{align-self:flex-start;background:#fff;border-color:#cbd5e1;border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:var(--sky-s);border-color:#93c5fd;border-bottom-right-radius:4px}
.bub .who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.bub.l .who{color:var(--purple)}
.bub.r .who{color:var(--sky)}
.bub .line{font-size:16px;font-weight:600;color:var(--navy)}

/* Puzzles & Quizzes */
.qblock{border:1.5px solid var(--border);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.qblock.solved{border-color:var(--emerald);background:#f0fdf4}
.qtitle{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:15px}
.opt{border:1.5px solid var(--border);background:#f8fafc;border-radius:10px;padding:9px 12px;min-height:42px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left;color:var(--navy)}
.opt.good{background:var(--emerald-s);border-color:var(--emerald);color:#065f46}
.opt.bad{background:var(--coral-s);border-color:var(--coral);color:var(--coral-d)}

/* Mystery Card & Clue Board */
.secret-card{border:2.5px dashed var(--purple);border-radius:18px;padding:16px;background:var(--purple-s);text-align:center}
.clue-log{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto;margin-top:10px}
.clue-item{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}

/* Podcast Timer */
.timer-box{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:10px 0}
.timer-num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* DEC Board */
.star-box{background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:12px}
.upg-box{background:#fff7ed;border:1.5px solid #fdba74;border-radius:14px;padding:12px}

/* Bottom Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--border);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.nav .btn{flex:1;max-width:420px;min-height:50px}
.faded{filter:blur(5px);user-select:none;transition:filter .2s}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ===== v2 mobile hardening & Pexels media/vocab/teacher styles ===== */
:root{color-scheme:light}
body{overscroll-behavior-y:contain}
.top{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.nav{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.brand>div{min-width:0}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:720px){.two,.three{grid-template-columns:minmax(0,1fr)}}
.card,.pbox,.banner,.chip,.tok,.opt,.bub .line,.qtitle,.lbl{overflow-wrap:anywhere}
.btn,.chip,.opt,.tok,.dot,.slow,.pill-bar button,.gear{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-appearance:none;appearance:none;scroll-margin-bottom:140px}
::placeholder{color:#64748b;opacity:1}
h2:focus{outline:none}
.chip:active,.opt:active{transform:scale(.97)}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.sort-btn{min-height:40px;padding:4px 10px}
.chip.compact{min-height:40px;font-size:13px;padding:6px 12px}
.bonus-tag{display:inline-flex;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;color:#475569}
.dot{height:8px;position:relative;background:rgba(255,255,255,.4)}
.dot::after{content:'';position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.gear{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#0f213d;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:min(92vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.typing .nav{display:none}
@media (pointer:coarse){
  .chip,.opt,.btn.sm,.sort-btn,.chip.compact{min-height:44px}
  .pill-bar button,.slow{min-height:40px}
}
@media (max-width:560px){
  .top{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
  .top-in{gap:6px}
  .brand b{display:none}
  .brand small{display:block;font-size:13px;font-weight:700;opacity:1}
  .gear{display:inline-flex;align-items:center;gap:4px;margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;min-height:40px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
  .controls{display:none;width:100%}
  .top.open .controls{display:flex}
  .pill-bar{flex:1}
  .pill-bar button{flex:1}
  .dots{margin-top:6px}
}
@media (max-width:420px){.pill-bar .lg{display:none}}
@media (max-width:380px){.nav .btn{font-size:14px;line-height:1.15;padding:8px 10px}}
@media (max-height:480px) and (orientation:landscape){
  .top{position:static}
  .nav{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .nav .btn{min-height:42px}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* Pexels Media Slots, Slide Hero & Vocabulary Cards */
.img{position:relative;background:linear-gradient(135deg,#eff6ff,#fef3c7);overflow:hidden;width:100%;border-radius:12px}
.img.r43{aspect-ratio:4/3}
.img.r1610{aspect-ratio:16/10}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.fb{position:absolute;inset:0;display:grid;place-items:center;padding:8px;z-index:1}
.fb svg{width:54px;height:54px;display:block}
.credit{position:absolute;left:5px;right:5px;bottom:5px;z-index:3;font-size:10px;line-height:1.2;color:#fff;background:rgba(15,23,42,.86);padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:#fff;text-decoration:underline}

.slide-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;margin-bottom:6px}
.slide-top-txt{flex:1;min-width:150px}
.slide-hero{width:106px;flex-shrink:0;border:1.5px solid var(--border);border-radius:12px;overflow:hidden}
.slide-hero .fb svg{width:40px;height:40px}
.slide-hero .credit{font-size:9px;padding:1px 4px}

.v-ico{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:#eff6ff;border-radius:6px;flex-shrink:0;overflow:hidden;position:relative;border:1px solid #dbeafe}
.v-ico svg{width:18px;height:18px;display:block}
.v-ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}

.spot-img{width:76px;height:58px;border-radius:10px;overflow:hidden;flex-shrink:0;border:1px solid var(--border)}
.spot-img .fb svg{width:34px;height:34px}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:10px}
.vcard{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.vcard.done{border-color:var(--emerald);background:#f0fdf4}
.vcard .vbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;flex:1}
.vcard .vw{font-weight:800;font-size:15px;color:var(--navy);line-height:1.2}
.vcard .vp{font-size:12px;font-weight:700;color:var(--sky)}

.beat-tag{display:inline-flex;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.meter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(135deg,#eff6ff,#ecfdf5);border:1.5px solid #86efac;border-radius:14px;padding:10px 14px;margin:10px 0}
.meter-pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;color:var(--navy)}

.t-fab{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 6px 18px rgba(15,33,61,.24)}
.t-backdrop{position:fixed;inset:0;background:rgba(15,33,61,.48);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.t-sheet{background:#fff;width:100%;max-width:720px;max-height:84vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(15,33,61,.2)}
.t-note-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px}
.t-badge-ahead{display:inline-block;background:#ecfdf5;color:#065f46;border:1px solid #86efac;padding:2px 8px;border-radius:8px;font-weight:800;font-size:13px}
.t-badge-behind{display:inline-block;background:#fff1ef;color:#991b1b;border:1px solid #fca5a5;padding:2px 8px;border-radius:8px;font-weight:800;font-size:13px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:4px 12px 0}
footer a{color:var(--navy);font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo">ENG</div>
      <div>
        <b>English Conversation Lab</b>
        <small id="stepSub">1. Hot Takes • Interactive Lesson</small>
      </div>
    </div>
    <button type="button" class="gear" id="gearBtn" data-act="gear" aria-expanded="false" aria-controls="controls">Level 2 ▾</button>

      <div class="pill-bar" role="group" aria-label="Difficulty level">

        <button type="button" data-act="diff" data-arg="2" id="d2" aria-pressed="false">L2 <span class="lg">Standard</span></button>

</header>

<main class="wrap">

</main>

<div id="teacherRoot"></div>

<nav class="nav">

  <button type="button" class="btn pri" id="nextBtn" data-act="next">Next</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var KEY = 'eng_l1_lesson_v2';
var PEXELS_CACHE_KEY = 'eng_pexels_cache_v1';
var CONFIG = {
  teacher:'your teacher',
  place:'Interactive Lesson',
  stateTtlMs: 12*60*60*1000,
  pexelsKey:'aRt9wdxpc76Ermz7SgTz6Elm6okhs12NLX2lIYptDtGbkv9S1y37Zxag',

var PEXELS_MEM = {};
var pxQueue = [], pxInFlight = 0, pxRequested = {}, pxFailed = {};

function loadPexelsCache(){
  try{
    var raw = JSON.parse(localStorage.getItem(PEXELS_CACHE_KEY)||'null');
    if(!raw || !raw._t || (Date.now()-raw._t) > CONFIG.pexelsTtlMs) return;
    if(raw.items && typeof raw.items === 'object'){ PEXELS_MEM = raw.items; }
  }catch(e){}
}
function savePexelsCache(){
  try{ localStorage.setItem(PEXELS_CACHE_KEY, JSON.stringify({_t:Date.now(), items:PEXELS_MEM})); }catch(e){}
}
loadPexelsCache();

function applyPexelsToDom(id){
  var p = PEXELS_MEM[id];
  if(!p || !p.url) return;
  var imgs = document.querySelectorAll('[data-px-img="'+id+'"]');
  for(var i=0;i<imgs.length;i++){
    var img = imgs[i];
    var sz = img.getAttribute('data-px-sz')==='thumb' ? (p.thumb||p.url) : p.url;
    if(img.getAttribute('src') !== sz){
      img.setAttribute('src', sz);
      img.style.display = 'block';
    }
  }
  var creds = document.querySelectorAll('[data-px-cred="'+id+'"]');
  for(var j=0;j<creds.length;j++){
    var cr = creds[j];
    cr.innerHTML = 'Photo: <a href="'+esc(p.byUrl||'https://www.pexels.com')+'" target="_blank" rel="noopener">'+esc(p.by||'Pexels')+'</a> / <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a>';
    cr.style.display = 'block';
  }
}

function pxProcessQueue(){
  while(pxInFlight < 3 && pxQueue.length > 0){
    (function(id){
      pxInFlight++;
      var q = PEXELS_QUERIES[id] || id;
      var xhr = new XMLHttpRequest();
      var url = 'https://api.pexels.com/v1/search?query='+encodeURIComponent(q)+'&per_page=1&orientation=landscape';
      xhr.open('GET', url, true);
      xhr.setRequestHeader('Authorization', CONFIG.pexelsKey);
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        pxInFlight = Math.max(0, pxInFlight - 1);
        if(xhr.status >= 200 && xhr.status < 300){
          try{
            var data = JSON.parse(xhr.responseText);
            if(data && data.photos && data.photos.length > 0){
              var ph = data.photos[0];
              PEXELS_MEM[id] = {
                url: (ph.src && (ph.src.medium || ph.src.small || ph.src.landscape)) || '',
                thumb: (ph.src && (ph.src.tiny || ph.src.small || ph.src.medium)) || '',
                by: ph.photographer || 'Pexels',
                byUrl: ph.photographer_url || ph.url || 'https://www.pexels.com'
              };
              savePexelsCache();
              applyPexelsToDom(id);
            } else { pxFailed[id] = true; }
          }catch(e){ pxFailed[id] = true; }
        } else { pxFailed[id] = true; }

var voices = [], speakTimer = null;
function lv(){ if(audioOK){ try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; } } }
if(audioOK){
  lv();
  try{ window.speechSynthesis.addEventListener('voiceschanged', lv); }
  catch(e){ window.speechSynthesis.onvoiceschanged = lv; }
}
function pickVoice(lang){
  var l = lang.toLowerCase(), b = l.slice(0,2);
  var pref = /Samantha|Ava|Allison|Aria|Jenny|Google US English|Paulina|Monica|Sabina/i;
  var ex = voices.filter(function(v){ return (v.lang||'').replace('_','-').toLowerCase()===l; });
  var ba = voices.filter(function(v){ return (v.lang||'').toLowerCase().indexOf(b)===0; });
  return ex.filter(function(v){return pref.test(v.name);})[0] || ex[0] || ba.filter(function(v){return pref.test(v.name);})[0] || ba[0] || null;
}
function toast(msg){
  var t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 3800);
}
function speak(text, lang){
  if(!text) return;
  if(!audioOK){ toast('Audio is not available on this device. Please read it aloud with your teacher.'); return; }
  var ss = window.speechSynthesis;
  if(!voices.length) lv();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  var v = pickVoice(u.lang); if(v) u.voice = v;

  };
  clearTimeout(speakTimer);
  try{ if(ss.paused) ss.resume(); }catch(e){}
  if(ss.speaking || ss.pending){ ss.cancel(); speakTimer = setTimeout(function(){ ss.speak(u); }, 80); }

/* Timer */
function fmtTime(sec){
  var s = Math.max(0, Math.floor(sec));
  var m = Math.floor(s/60), r = s%60;
  return m+':'+(r<10?'0':'')+r;
}
function timerRemaining(){
  if(S.timerRun) return Math.max(0, Math.ceil((S.timerEnd - Date.now())/1000));
  return S.timerLeft;
}
function stopTimer(){
  if(S.timerRun){ S.timerLeft = timerRemaining(); S.timerRun = false; S.timerEnd = 0; }
  if(timerId){ clearInterval(timerId); timerId = null; }
}
function tickTimer(){
  var left = timerRemaining();
  var tv = document.getElementById('timerVal');
  if(tv) tv.textContent = fmtTime(left);
  if(left <= 0){
    S.timerRun = false; S.timerLeft = 0; S.timerEnd = 0;
    if(timerId){ clearInterval(timerId); timerId = null; }
    speak('Time is up! Great job!');
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    render();
  }
}
function startTimer(){
  if(S.timerLeft <= 0) S.timerLeft = TIMER_LEN;
  S.timerEnd = Date.now() + S.timerLeft*1000;
  S.timerRun = true;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(tickTimer, 500);
  save();
}

function subjLower(sub){ return sub==='I' ? 'I' : sub.toLowerCase(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function is3p(sub){ return sub==='She' || sub==='He'; }
function doForm(sub){ return is3p(sub) ? 'does' : 'do'; }
function doNegForm(sub){ return is3p(sub) ? "doesn't" : "don't"; }
function beForm(sub){ return sub==='I' ? 'am' : (is3p(sub) ? 'is' : 'are'); }
function beNegForm(sub){ return sub==='I' ? 'am not' : (is3p(sub) ? "isn't" : "aren't"); }
function shortAnswer(kind, sub){
  var who = {'I':'you','You':'I','She':'she','He':'he','They':'they'}[sub];
  var pos, neg;
  if(kind==='do'){
    var third = (who==='she' || who==='he');
    pos = 'Yes, '+who+' '+(third?'does':'do')+'.';
    neg = 'No, '+who+' '+(third?"doesn't":"don't")+'.';
  } else if(who==='I'){ pos='Yes, I am.'; neg="No, I'm not."; }
  else if(who==='you'){ pos='Yes, you are.'; neg="No, you aren't."; }
  else if(who==='she' || who==='he'){ pos='Yes, '+who+' is.'; neg="No, '+who+" isn't."; }
  else { pos='Yes, they are.'; neg="No, they aren't."; }
  return pos+' / '+neg;
}
function currentItem(){
  return S.track==='do' ? (TRACK_DO_VERBS[S.bVerb] || TRACK_DO_VERBS[0])
                        : (TRACK_BE_STATES[S.bVerb] || TRACK_BE_STATES[0]);
}
function validWhList(){ var it = currentItem(); return WH_ORDER.filter(function(k){ return !!it.wh[k]; }); }
function ensureWh(){
  var list = (S.track==='do' ? TRACK_DO_VERBS : TRACK_BE_STATES);
  if(S.bVerb >= list.length) S.bVerb = 0;
  var ok = validWhList();
  if(ok.indexOf(S.bWh) < 0) S.bWh = (ok.indexOf('Why') >= 0 ? 'Why' : ok[0]);
}
function whSentence(it, aux, s, isDo){
  var tpl = it.wh[S.bWh];
  var text = tpl.replace('{aux}',aux).replace('{be}',aux).replace('{s}',s);
  var m = tpl.match(/^(.*?)\s*\{(?:aux|be)\}\s*\{s\}\s*(.*)$/);
  var rest = m[2].replace(/\?$/,'');
  var T = [{c:'c',t:m[1]},{c:'v',t:aux},{c:'i',t:s}];
  if(isDo && rest.indexOf(it.v1) === 0){
    T.push({c:'v',t:it.v1});
    var tail = rest.slice(it.v1.length).trim();
    if(tail) T.push({c:(it.oc||'n'),t:tail});
  } else if(rest){ T.push({c:'n',t:rest}); }
  T[T.length-1].t += '?';
  return {tokens:T, text:text};
}
function buildSentence(){
  ensureWh();
  var sub = S.bSubj, s = subjLower(sub), it = currentItem(), T, text;
  if(S.track==='do'){
    var aux = doForm(sub), vb = is3p(sub) ? it.v3 : it.v1;
    if(S.bPol==='+'){
      T=[{c:'i',t:sub},{c:'v',t:vb},{c:it.oc,t:it.obj+'.'}];
      text = sub+' '+vb+' '+it.obj+'.';
    } else if(S.bPol==='-'){
      T=[{c:'i',t:sub},{c:'v',t:doNegForm(sub)},{c:'v',t:it.v1},{c:it.oc,t:it.obj+'.'}];
      text = sub+' '+doNegForm(sub)+' '+it.v1+' '+it.obj+'.';
    } else if(S.bPol==='?'){
      T=[{c:'v',t:cap(aux)},{c:'i',t:s},{c:'v',t:it.v1},{c:it.oc,t:it.obj+'?'},{c:'c',t:shortAnswer('do',sub)}];
      text = cap(aux)+' '+s+' '+it.v1+' '+it.obj+'?';
    } else { return whSentence(it, aux, s, true); }
  } else {
    var be = beForm(sub);
    if(S.bPol==='+'){
      T=[{c:'i',t:sub},{c:'v',t:be},{c:'n',t:it.st+'.'}];
      text = sub+' '+be+' '+it.st+'.';
    } else if(S.bPol==='-'){
      T=[{c:'i',t:sub},{c:'v',t:beNegForm(sub)},{c:'n',t:it.st+'.'}];
      text = sub+' '+beNegForm(sub)+' '+it.st+'.';
    } else if(S.bPol==='?'){
      T=[{c:'v',t:cap(be)},{c:'i',t:s},{c:'n',t:it.st+'?'},{c:'c',t:shortAnswer('be',sub)}];
      text = cap(be)+' '+s+' '+it.st+'?';
    } else { return whSentence(it, be, s, false); }
  }
  return {tokens:T, text:text};
}

function normGuess(s){ return ' '+String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()+' '; }
function guessIsRight(card, guess){
  var g = normGuess(guess);
  for(var i=0;i<card.alts.length;i++){ if(g.indexOf(' '+card.alts[i]+' ') >= 0) return true; }
  return false;
}
function dealMysteryCard(){
  var avail = [];
  for(var i=0;i<MYSTERY_CARDS.length;i++){
    if(S.mysUsed.indexOf(MYSTERY_CARDS[i].id) < 0) avail.push(i);
  }
  if(!avail.length){
    S.mysUsed = [];
    for(var j=0;j<MYSTERY_CARDS.length;j++) avail.push(j);
  }
  var pickIdx = avail[Math.floor(Math.random()*avail.length)];
  S.mysCard = pickIdx;
  S.mysUsed.push(MYSTERY_CARDS[pickIdx].id);
  S.mysHidden = true;
  clearTimeout(peekTimer);
  S.mysQCount = 0; S.mysLog = []; S.mysQ = ''; S.mysGuess = ''; S.mysResult = '';
}

function copyText(txt, cb){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.fontSize='16px';
    document.body.appendChild(ta); ta.select();
    try{ ta.setSelectionRange(0, txt.length); }catch(e){}
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); cb(ok);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ cb(true); }, fallback);
  } else { fallback(); }
}

    ? '<span class="t-badge-ahead">ahead by '+fmtTime(diffSec)+'</span>'

  return '<strong>'+fmtTime(elapsed/1000)+' elapsed</strong> — stage '+(S.step+1)+' target end '+targetMin+':00 — '+badge;

      h += '<div class="lbl mt">★ Stars ('+S.notes.stars.length+')</div>';
      S.notes.stars.forEach(function(n, i){
        h += '<div class="t-note-row"><span>'+esc(n)+'</span><button type="button" class="btn sm ghost" data-act="tdelstar" data-arg="'+i+'" aria-label="Delete star">×</button></div>';
      });
    }
    if(S.notes.ups.length){
      h += '<div class="lbl mt">⬆ Upgrades ('+S.notes.ups.length+')</div>';
      S.notes.ups.forEach(function(n, i){
        h += '<div class="t-note-row"><span>'+esc(n)+'</span><button type="button" class="btn sm ghost" data-act="tdelup" data-arg="'+i+'" aria-label="Delete upgrade">×</button></div>';
      });
    }
    h += '</div>';

    h += '<div class="hint-box mt"><strong>If running late — cut in this order:</strong><br>'+
      '1) Hot Take 4 • 2) Puzzle 3 • 3) Sound sort 5–6 • 4) Flip cues 5–6 • 5) Mystery round 2 → 2 questions • 6) Podcast report back → 1 fact each. <em>Never cut the voice-note mission.</em></div>';
    h += '<div class="ok-box mt"><strong>Decision rules:</strong><br>'+
      '• Younger partner silent on 2 topics in a row → switch to L1 &amp; make older partner the asker.<br>'+
      '• Older partner finishes in &lt; half time → switch to L3 for next stage only.<br>'+
      '• Both miss same bug twice → explain rule in Spanish &amp; redo it.</div>';

    h += '</div></div>';
    if(!clockTimer){
      clockTimer = setInterval(function(){
        var cl = document.getElementById('tClockLine');
        if(cl) cl.innerHTML = clockSummaryHtml();
      }, 1000);
    }
  } else {
    stopClockTimer();
  }
  root.innerHTML = h;
}

/* =========================================================
   CHROME, NAVIGATION & RENDER ENGINE
========================================================= */
var STEP_FNS = [s0,s1,s2,s3,s4,s5,s6];

function announce(msg){
  var L = document.getElementById('live'); if(!L) return;
  L.textContent = '';
  setTimeout(function(){ L.textContent = msg; }, 40);
}

function updateChrome(){
  var d = document.getElementById('dots'), h = '';
  for(var i=0;i<STEPS.length;i++){
    h += '<button type="button" class="dot'+(i<S.step?' done':(i===S.step?' now':''))+'" data-act="jump" data-arg="'+i+'" aria-label="Go to step '+(i+1)+': '+esc(STEPS[i])+'"'+(i===S.step?' aria-current="step"':'')+'></button>';
  }
  d.innerHTML = h;
  document.getElementById('stepSub').textContent = STEPS[S.step]+' • '+CONFIG.place;
  var back = document.getElementById('backBtn'), next = document.getElementById('nextBtn');
  var last = (S.step === STEPS.length-1);
  back.disabled = S.step===0;
  if(!last){
    next.textContent = 'Next: '+STEPS[S.step+1];
    next.setAttribute('data-act','next');
  } else {
    next.textContent = restartArmed ? 'Tap again to restart' : 'Restart Lesson';
    next.setAttribute('data-act','restart');
  }
  next.classList.toggle('ghost', last);
  next.classList.toggle('pri', !last);

  [1,2,3].forEach(function(n){
    var b = document.getElementById('d'+n);
    b.classList.toggle('on', S.diff===n);
    b.setAttribute('aria-pressed', S.diff===n ? 'true' : 'false');
  });
  var sb = document.getElementById('slowBtn');
  sb.textContent = 'Slow voice: '+(S.slow?'On':'Off');
  sb.classList.toggle('on', !!S.slow);
  sb.setAttribute('aria-pressed', S.slow?'true':'false');

  var topEl = document.querySelector('.top');
  if(topEl) topEl.classList.toggle('open', gearOpen);
  var gb = document.getElementById('gearBtn');
  if(gb){
    gb.textContent = 'Level '+S.diff+(S.slow?' · Slow':'')+' ▾';
    gb.setAttribute('aria-expanded', gearOpen?'true':'false');
  }
  renderTeacher();
}

function render(opts){
  opts = opts || {};
  var y = window.pageYOffset;
  var ae = document.activeElement, fa = null, fg = null;
  if(ae && ae !== document.body && app.contains(ae) &&
     (ae.tagName === 'BUTTON' || ae.getAttribute('role') === 'button')){
    fa = ae.getAttribute('data-act'); fg = ae.getAttribute('data-arg');
  }
  try{
    app.innerHTML = STEP_FNS[S.step]();
  }catch(err){
    app.innerHTML = '<div class="card"><h2>Oops — something went wrong</h2>'+
      '<p class="sub">Tap the button to start fresh.</p>'+
      '<button type="button" class="btn pri" data-act="hardreset">Restart lesson</button></div>';
    try{ console.error(err); }catch(e){}
  }
  updateChrome();
  pxLoadVisible();
  if(S.step===5 && S.podStage==='interview' && S.timerRun && !timerId){ timerId = setInterval(tickTimer, 500); }
  save();
  if(!opts.top){ window.scrollTo(0, y); }
  if(fa){
    var sel = '[data-act="'+fa+'"]' + (fg!==null ? '[data-arg="'+String(fg).replace(/["\\]/g,'\\$&')+'"]' : '');
    var el = app.querySelector(sel);
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){} }
  }
}

function goStep(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  if(n !== 5) stopTimer();
  restartArmed = false; clearTimeout(restartTimer);
  S.step = n;
  if(audioOK) try{ window.speechSynthesis.cancel(); }catch(e){}
  render({top:true});
  window.scrollTo(0,0);
  var h = app.querySelector('h2');
  if(h){ h.setAttribute('tabindex','-1'); try{ h.focus({preventScroll:true}); }catch(e){} }
  announce('Step '+(n+1)+' of '+STEPS.length+': '+STEPS[n]);
}

function toggleArr(arr, val, max){
  var i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1);
  else{
    if(max && arr.length>=max) arr.shift();
    arr.push(val);
  }
}

function act(el){
  var a = el.getAttribute('data-act'), arg = el.getAttribute('data-arg') || '';
  switch(a){
    case 'say': speak(arg); break;
    case 'next': goStep(S.step+1); break;
    case 'back': goStep(S.step-1); break;
    case 'jump': goStep(parseInt(arg,10)); break;
    case 'gear': gearOpen = !gearOpen; updateChrome(); break;
    case 'hardreset':
      stopTimer(); clearTimeout(peekTimer);
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = freshState(); applyUrlParams(); render({top:true}); break;
    case 'restart':
      if(!restartArmed){
        restartArmed = true; updateChrome();
        clearTimeout(restartTimer);
        restartTimer = setTimeout(function(){ restartArmed = false; updateChrome(); }, 4000);
        break;
      }
      restartArmed = false; clearTimeout(restartTimer);
      stopTimer(); clearTimeout(peekTimer);
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = freshState(); applyUrlParams(); render({top:true}); window.scrollTo(0,0);
      break;
    case 'slow': S.slow = !S.slow; updateChrome(); save(); break;
    case 'diff': S.diff = parseInt(arg,10); render(); break;

    // Step 0
    case 'take':
      var tp = arg.split(':');
      if(!S.takes[S.takeIdx]) S.takes[S.takeIdx] = {};
      S.takes[S.takeIdx][tp[0]] = tp[1];
      render(); break;
    case 'takenav':
      S.takeIdx = Math.max(0, Math.min(HOT_TAKES.length-1, S.takeIdx+parseInt(arg,10)));
      render(); break;

    // Step 1
    case 'gist': S.gist = arg; render(); break;
    case 'es': S.es = !S.es; render(); break;
    case 'disc':
      var dp = arg.split(':');
      S.disc[parseInt(dp[0],10)] = parseInt(dp[1],10);
      render(); break;

    // Step 2
    case 'track': S.track = arg; S.bVerb = 0; S.revealB = false; ensureWh(); render(); break;
    case 'bsubj': S.bSubj = arg; S.revealB = false; ensureWh(); render(); break;
    case 'bpol': S.bPol = arg; S.revealB = false; ensureWh(); render(); break;
    case 'bwh': S.bWh = arg; S.revealB = false; ensureWh(); render(); break;
    case 'bverb': S.bVerb = parseInt(arg,10); S.revealB = false; ensureWh(); render(); break;
    case 'revealb': S.revealB = true; render(); break;
    case 'sort':
      var sp = arg.split(':');
      S.sortAns[parseInt(sp[0],10)] = sp[1];
      render(); break;
    case 'vocabcheck': toggleArr(S.vocabDone, arg); render(); break;
    case 'proncheck': toggleArr(S.pronDone, arg); render(); break;

    // Step 3
    case 'bug':
      var idx = parseInt(arg.slice(0,arg.indexOf(':')),10);
      var ch = arg.slice(arg.indexOf(':')+1);
      if(S.bugs[idx] && S.bugs[idx].done) break;
      S.bugs[idx] = {choice:ch, done:(ch===BUGS[idx].ans), tries:((S.bugs[idx]&&S.bugs[idx].tries)||0)+1};
      render(); break;
    case 'fliprev': S.flipRevealed = !S.flipRevealed; render(); break;
    case 'flipnav':
      S.flipIdx = Math.max(0, Math.min(FLIPS.length-1, S.flipIdx+parseInt(arg,10)));
      S.flipRevealed = false;
      render(); break;

    // Step 4
    case 'mysshield':
      S.mysHidden = !S.mysHidden; clearTimeout(peekTimer);
      if(!S.mysHidden){ peekTimer = setTimeout(function(){ S.mysHidden = true; if(S.step===4) render(); }, 8000); }
      render(); break;
    case 'mysdeal':
      dealMysteryCard(); render(); break;
    case 'myscard':
      S.mysCard = parseInt(arg,10); S.mysHidden = true; clearTimeout(peekTimer);
      S.mysQCount = 0; S.mysLog = []; S.mysQ = ''; S.mysGuess = ''; S.mysResult = '';
      render(); break;
    case 'mysfade': S.mysFade = !S.mysFade; render(); break;
    case 'mysreset': S.mysQCount = 0; S.mysLog = []; S.mysGuess = ''; S.mysResult = ''; render(); break;
    case 'myslog':
      if(S.mysQCount >= 4 || S.mysResult) break;
      var qtxt = (S.mysQ||'').trim() ? S.mysQ.trim() : 'Question #'+(S.mysQCount+1);
      S.mysQCount = Math.min(4, S.mysQCount+1);
      S.mysLog.unshift({q:qtxt, a:arg});
      S.mysQ = '';
      render(); break;
    case 'mysguess':
      var gi = document.getElementById('mysGuessInput');
      if(gi) S.mysGuess = gi.value;
      var card = MYSTERY_CARDS[S.mysCard] || MYSTERY_CARDS[0];
      S.mysResult = guessIsRight(card, S.mysGuess) ? 'right' : 'wrong';
      S.mysHidden = false; clearTimeout(peekTimer);
      render(); break;
    case 'mysnext':
      S.mysRound = 2;
      dealMysteryCard();
      render(); break;

    // Step 5
    case 'podstage':
      if(arg!=='interview') stopTimer();
      S.podStage = arg; render(); break;
    case 'podtopic': S.podTopic = parseInt(arg,10); S.podQ1=[]; S.podQ2=[]; render(); break;
    case 'podkw':
      var kp = arg.indexOf(':');
      var whoNum = parseInt(arg.slice(0,kp),10), kw = arg.slice(kp+1);
      toggleArr(whoNum===1?S.podQ1:S.podQ2, kw, 3);
      render(); break;
    case 'timertog':
      if(S.timerRun){ stopTimer(); } else { startTimer(); }
      render(); break;
    case 'timerreset': stopTimer(); S.timerLeft = TIMER_LEN; render(); break;
    case 'podturn': stopTimer(); S.timerLeft = TIMER_LEN; S.podTurn = (S.podTurn===1?2:1); render(); break;
    case 'podver':
      var vp = arg.split(':');
      if(vp[0]==='1') S.podVerify1 = vp[1]; else S.podVerify2 = vp[1];
      render(); break;

    // Step 6
    case 'saystar': speak(S.stars[parseInt(arg,10)]||''); break;
    case 'upgdone':
      var ui = parseInt(arg,10);
      if(!S.upgrades[ui].done && !S.upgrades[ui].fixed.trim()){
        toast('Type your upgraded sentence first!');
        break;
      }
      S.upgrades[ui].done = !S.upgrades[ui].done;
      render(); break;
    case 'fillnotes':
      S.stars[0] = S.notes.stars[0] || '';
      S.stars[1] = S.notes.stars[1] || '';
      for(var ni=0;ni<3;ni++){
        S.upgrades[ni] = {bad:(S.notes.ups[ni]||''), fixed:'', done:false};
      }
      render(); break;
    case 'fillexamples':
      S.stars = ["I don't wake up early on Saturdays because I'm tired!","My partner listens to pop music, but she doesn't watch horror movies."];
      S.upgrades = [
        {bad:"She don't like coffee.", fixed:'', done:false},
        {bad:"Does she plays soccer?", fixed:'', done:false},
        {bad:"I like it because is funny.", fixed:'', done:false}
      ];
      render(); break;
    case 'rate': S.rating = parseInt(arg,10); render(); break;
    case 'cando': toggleArr(S.candos, parseInt(arg,10)); render(); break;
    case 'copyhw':
      copyText(missionText(), function(ok){ S.hwCopied = ok; S.hwFail = !ok; render(); });
      break;
    case 'sharehw':
      if(navigator.share){ navigator.share({title:'Voice Mission', text:missionText()}).catch(function(){}); }
      break;

    // Teacher drawer
    case 'topen': teacherOpen = !teacherOpen; renderTeacher(); break;
    case 'tclose': teacherOpen = false; renderTeacher(); break;
    case 'tclock':
      if(S.clockT0){ S.clockAcc += (Date.now() - S.clockT0); S.clockT0 = 0; }
      else { S.clockT0 = Date.now(); }
      save(); renderTeacher(); break;
    case 'tclockreset': S.clockAcc = 0; S.clockT0 = 0; save(); renderTeacher(); break;
    case 'taddstar':
      var ti = document.getElementById('tNoteInput');
      if(ti && ti.value.trim()){
        if(S.notes.stars.length >= 10) S.notes.stars.shift();
        S.notes.stars.push(ti.value.trim());
        ti.value = ''; save(); renderTeacher();
      }
      break;
    case 'taddup':
      var ti2 = document.getElementById('tNoteInput');
      if(ti2 && ti2.value.trim()){
        if(S.notes.ups.length >= 10) S.notes.ups.shift();
        S.notes.ups.push(ti2.value.trim());
        ti2.value = ''; save(); renderTeacher();
      }
      break;
    case 'tdelstar': S.notes.stars.splice(parseInt(arg,10),1); save(); renderTeacher(); break;
    case 'tdelup': S.notes.ups.splice(parseInt(arg,10),1); save(); renderTeacher(); break;
  }
}

document.addEventListener('click', function(e){
  if(e.target && e.target.closest && e.target.closest('a')) return;
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-act')==='tbackdrop'){
    teacherOpen = false; renderTeacher(); return;
  }
  var el = e.target.closest('[data-act]');
  if(el && el.getAttribute('data-act')!=='tbackdrop') act(el);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && teacherOpen){ teacherOpen = false; renderTeacher(); return; }
  if((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role="button"]')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='n1'){ S.s1 = t.value; save(); }
  else if(t.id==='n2'){ S.s2 = t.value; save(); }
  else if(t.id==='mysQInput'){ S.mysQ = t.value; save(); }
  else if(t.id==='mysGuessInput'){ S.mysGuess = t.value; save(); }
  else if(t.id==='podNotes'){
    if(S.podTurn===1) S.podNotes1 = t.value; else S.podNotes2 = t.value;
    save();
  }
  else if(t.hasAttribute('data-star')){ S.stars[parseInt(t.getAttribute('data-star'),10)] = t.value; save(); }
  else if(t.hasAttribute('data-upgbad')){ S.upgrades[parseInt(t.getAttribute('data-upgbad'),10)].bad = t.value; save(); }
  else if(t.hasAttribute('data-upgfix')){ S.upgrades[parseInt(t.getAttribute('data-upgfix'),10)].fixed = t.value; save(); }
});
document.addEventListener('focusin', function(e){
  if(e.target.matches && e.target.matches('input[type=text],textarea')) document.body.classList.add('typing');
});
document.addEventListener('focusout', function(){
  setTimeout(function(){
    var a = document.activeElement;
    if(!(a && a.matches && a.matches('input[type=text],textarea'))) document.body.classList.remove('typing');
  }, 60);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && S.timerRun) tickTimer();
});

render();
})();
</script>

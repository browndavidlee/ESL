
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f213d">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f213d'/%3E%3Ctext x='32' y='40' font-family='Arial' font-size='20' font-weight='800' text-anchor='middle' fill='%23fff'%3EBAA2%3C/text%3E%3C/svg%3E">
<title>Brown American Academy — Class 2: Partner Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{
  --navy:#0f213d;--navy-2:#17315a;--coral:#b93626;--coral-d:#99291b;--coral-s:#fff1ef;
  --emerald:#047857;--emerald-s:#ecfdf5;--sky:#1d4ed8;--sky-s:#eff6ff;
  --amber:#b45309;--amber-s:#fef6e6;--purple:#6d28d9;--purple-s:#f5f3ff;
  --bg:#f4f7fb;--text:#1e293b;--muted:#475569;--border:#cbd5e1;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  touch-action:manipulation;
  overscroll-behavior-y:contain;
}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Sticky Header */
.top{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  color:#fff;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
  box-shadow:0 4px 18px rgba(15,33,61,.16);
}
.top-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}
.logo{
  width:40px;height:40px;border-radius:11px;background:var(--coral);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
.brand b{display:block;font-size:15px;line-height:1.15}
.brand small{display:block;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill-bar{display:inline-flex;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:2px;gap:2px}
.pill-bar .plbl{font-size:11px;font-weight:800;padding:0 6px;opacity:.9;letter-spacing:.02em}
.pill-bar button{border:0;background:transparent;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;cursor:pointer;min-height:34px}
.pill-bar button.on{background:#fff;color:var(--navy)}
.slow{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 11px;min-height:38px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}
.slow.on{background:#fff;color:var(--navy)}
.gear{display:none}
.dots{display:flex;gap:6px;max-width:1020px;margin:8px auto 0}
.dot{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.35);cursor:pointer;border:0;padding:0;position:relative}
.dot::after{content:'';position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.dot.done{background:#fff}
.dot.now{background:#fca5a5}

/* Layout & Cards */
.wrap{
  max-width:1020px;margin:0 auto;
  padding:12px 12px calc(126px + env(safe-area-inset-bottom));
  padding-left:max(12px,env(safe-area-inset-left));
  padding-right:max(12px,env(safe-area-inset-right));
}
.card{
  background:#fff;border:1px solid var(--border);border-radius:18px;
  padding:16px;box-shadow:0 10px 30px rgba(15,33,61,.07);margin-bottom:14px;
  overflow-wrap:anywhere;
}
h2{margin:0 0 4px;color:var(--navy);font-size:clamp(21px,4.5vw,29px);line-height:1.2}
h2:focus{outline:none}
h3{margin:16px 0 8px;color:var(--navy);font-size:18px}
.sub{margin:0 0 10px;color:var(--muted);font-size:15px}
.mt{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:740px){.two,.three,.four{grid-template-columns:minmax(0,1fr)}}

/* Badges */
.stage-tag{display:inline-flex;align-items:center;gap:6px;background:var(--sky-s);color:var(--sky);border:1px solid #bfdbfe;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800}
.cefr-tag{display:inline-flex;align-items:center;background:var(--purple-s);color:var(--purple);border:1px solid #ddd6fe;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.bonus-tag{display:inline-flex;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;color:#475569}
.beat-tag{display:inline-flex;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.turn-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.turn-pill.a{background:var(--purple-s);color:var(--purple);border:1px solid #ddd6fe}
.turn-pill.b{background:var(--sky-s);color:var(--sky);border:1px solid #bfdbfe}

/* Inputs & Buttons */
.lbl{display:block;font-weight:700;font-size:14px;color:var(--navy);margin:6px 0 4px}
input[type=text],textarea{
  font-family:inherit;font-size:16px;padding:10px 13px;min-height:46px;
  border-radius:12px;border:1.5px solid var(--border);width:100%;
  color:var(--text);background:#fff;-webkit-appearance:none;appearance:none;
  scroll-margin-bottom:140px;
}
textarea{min-height:78px;resize:vertical}
::placeholder{color:#64748b;opacity:1}
.btn,.chip,.opt,.tok,.dot,.slow,.pill-bar button,.gear,.vcard,.theme-card,.cue-card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn{
  border:0;border-radius:12px;padding:11px 16px;min-height:48px;
  font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease,background .15s ease;
}
.btn:active,.chip:active,.opt:active{transform:scale(.97)}
.btn[disabled],.chip[disabled]{opacity:.38;cursor:not-allowed}
.btn.sm{min-height:40px;padding:7px 12px;font-size:13px;border-radius:10px}
.pri{background:var(--coral);color:#fff}.pri:hover{background:var(--coral-d)}
.sky{background:var(--sky);color:#fff}
.em{background:var(--emerald);color:#fff}
.purp{background:var(--purple);color:#fff}
.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
.chip{
  border:1.5px solid var(--border);background:#fff;color:var(--navy);
  border-radius:999px;padding:8px 14px;min-height:44px;
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;overflow-wrap:anywhere;
}
.chip.compact{min-height:40px;font-size:13px;padding:6px 12px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.yes.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.chip.no.on{background:var(--coral);border-color:var(--coral);color:#fff}
.chip.meh.on{background:var(--sky);border-color:var(--sky);color:#fff}

/* Grammar Color Tokens */
.banner{background:#f8fafc;border:2px dashed #94a3b8;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.tok{padding:7px 11px;border-radius:10px;font-weight:800;font-size:16px;font-family:inherit;border:2px solid transparent;display:inline-flex;align-items:center;gap:6px;min-height:42px;background:#f1f5f9;color:var(--navy);overflow-wrap:anywhere}
button.tok{cursor:pointer}
.tok.i{background:#d1fae5;color:#065f46;border-color:#059669;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
.tok.v{background:#dbeafe;color:#1e3a8a;border-color:#3b82f6;font-style:italic}
.tok.n{background:#fee2e2;color:#991b1b;border-color:#ef4444}
.tok.c{background:#fef3c7;color:#78350f;border-color:#d97706}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.legend .tok{font-size:12px;min-height:28px;padding:3px 9px}

/* Partner Boxes, Avatars & Visual Media */
.pbox{border:2px solid var(--border);border-radius:16px;padding:12px;background:#fff;overflow-wrap:anywhere}
.pbox.a{border-top:5px solid var(--purple)}
.pbox.b{border-top:5px solid var(--sky)}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--border);background:#fff}
.avatar.a{border-color:var(--purple);background:var(--purple-s)}
.avatar.b{border-color:var(--sky);background:var(--sky-s)}
.avatar svg{width:30px;height:30px;display:block}

.img{position:relative;background:linear-gradient(135deg,#eff6ff,#fef3c7);overflow:hidden;width:100%;border-radius:12px}
.img.r43{aspect-ratio:4/3}
.img.r1610{aspect-ratio:16/10}
.img.r169{aspect-ratio:16/9}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}
.fb{position:absolute;inset:0;display:grid;place-items:center;padding:8px;z-index:1}
.fb svg{width:64px;height:64px;display:block}
.credit{position:absolute;left:5px;right:5px;bottom:5px;z-index:3;font-size:10px;line-height:1.2;color:#fff;background:rgba(15,23,42,.85);padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit a{color:#fff;text-decoration:underline}

.slide-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;margin-bottom:6px}
.slide-top-txt{flex:1;min-width:160px}
.slide-hero{width:124px;flex-shrink:0;border:2px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(15,33,61,.08)}
.slide-hero .fb svg{width:46px;height:46px}
.slide-hero .credit{font-size:9px;padding:1px 4px}

.v-ico{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:#eff6ff;border-radius:7px;flex-shrink:0;overflow:hidden;position:relative;border:1px solid #dbeafe}
.v-ico svg{width:20px;height:20px;display:block}
.v-ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2}

.spot-img{width:88px;height:66px;border-radius:12px;overflow:hidden;flex-shrink:0;border:1.5px solid var(--border)}
.spot-img .fb svg{width:40px;height:40px}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:10px}
.vcard{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.vcard.done{border-color:var(--emerald);background:#f0fdf4}
.vcard .vbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;flex:1}
.vcard .vw{font-weight:800;font-size:15px;color:var(--navy);line-height:1.2}
.vcard .vp{font-size:12px;font-weight:700;color:var(--sky)}

.theme-card{border:2px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0;font-family:inherit;display:flex;flex-direction:column}
.theme-card.on{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(4,120,87,.2);background:var(--emerald-s)}
.theme-card .tbody{padding:8px 10px;font-weight:800;font-size:14px;color:var(--navy)}

.meter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(135deg,#eff6ff,#ecfdf5);border:1.5px solid #86efac;border-radius:14px;padding:10px 14px;margin:10px 0}
.meter-pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800;color:var(--navy);display:inline-flex;align-items:center;gap:5px}

.match-banner{background:linear-gradient(135deg,#047857,#065f46);color:#fff;border-radius:16px;padding:12px 16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:800;font-size:15px}
.match-banner .btn{background:rgba(255,255,255,.22);color:#fff}
.hint-box{background:var(--amber-s);border:1.5px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:#78350f;font-weight:600}
.ok-box{background:var(--emerald-s);border:1.5px solid var(--emerald);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:#065f46;font-weight:700}

/* Chat Bubbles */
.chat-wrap{display:flex;flex-direction:column;gap:10px;background:#f8fafc;border:1.5px solid var(--border);border-radius:16px;padding:14px;margin:10px 0}
.bub{max-width:90%;padding:10px 14px;border-radius:16px;cursor:pointer;border:1.5px solid transparent;display:flex;align-items:center;gap:10px}
.bub:active{transform:scale(.99)}
.bub.l{align-self:flex-start;background:#fff;border-color:#cbd5e1;border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:var(--sky-s);border-color:#93c5fd;border-bottom-right-radius:4px;flex-direction:row-reverse;text-align:right}
.bub .who{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.bub.l .who{color:var(--purple)}
.bub.r .who{color:var(--sky)}
.bub .line{font-size:16px;font-weight:600;color:var(--navy)}

/* Puzzles & Quizzes */
.qblock{border:1.5px solid var(--border);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.qblock.solved{border-color:var(--emerald);background:#f0fdf4}
.qtitle{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:15px;overflow-wrap:anywhere}
.opt{border:1.5px solid var(--border);background:#f8fafc;border-radius:10px;padding:9px 12px;min-height:44px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left;color:var(--navy);overflow-wrap:anywhere}
.opt.good{background:var(--emerald-s);border-color:var(--emerald);color:#065f46}
.opt.bad{background:var(--coral-s);border-color:var(--coral);color:var(--coral-d)}
.sort-btn{min-height:42px;padding:5px 11px}

/* Mystery Card & Clue Log */
.secret-card{border:2.5px dashed var(--purple);border-radius:18px;padding:14px;background:var(--purple-s);text-align:center}
.clue-log{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin-top:10px}
.clue-item{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}

/* Podcast Timer */
.timer-box{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:10px 0}
.timer-num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
@keyframes pulseMic{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.mic-live{animation:pulseMic 1.4s ease-in-out infinite}

/* Stars & Upgrades + Dash Tiles */
.dash-tile{border:1.5px solid var(--border);border-radius:14px;padding:10px;background:#fff;display:flex;align-items:center;gap:10px}
.dash-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--sky-s)}
.dash-ico svg{width:26px;height:26px;display:block}
.star-box{background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:12px}
.upg-box{background:#fff7ed;border:1.5px solid #fdba74;border-radius:14px;padding:12px}
.wtile{border:1.5px solid var(--sky);background:#eff6ff;color:var(--navy);border-radius:10px;padding:8px 12px;min-height:42px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center}
.wtile.used{opacity:.3;pointer-events:none;border-style:dashed}
.tray{min-height:58px;background:#fff;border:2px dashed #94a3b8;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0}
.bluff-opt{border:2px solid var(--border);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;width:100%;font-family:inherit;font-size:15px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.bluff-opt.picked{border-color:var(--purple);background:var(--purple-s)}
.bluff-opt.lie{border-color:var(--coral);background:var(--coral-s);color:var(--coral-d)}
.bluff-opt.truth{border-color:var(--emerald);background:var(--emerald-s);color:#065f46}
.sat-card{border:2px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0;font-family:inherit;display:flex;flex-direction:column}
.sat-card.on-a{border-color:var(--purple);box-shadow:0 0 0 2px rgba(109,40,217,.22)}
.sat-card.on-b{border-color:var(--sky);box-shadow:0 0 0 2px rgba(29,78,216,.22)}
.sat-card.on-f{border-color:var(--emerald);box-shadow:0 0 0 2px rgba(4,120,87,.24);background:var(--emerald-s)}
.sat-card .sbody{padding:7px 9px;font-weight:800;font-size:13px;color:var(--navy);line-height:1.25}

/* Bottom Nav & Toast */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#fff;border-top:1px solid var(--border);
  padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
  display:flex;gap:10px;justify-content:center;
}
.nav .btn{flex:1;max-width:440px;min-height:50px}
body.typing .nav{display:none}
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:#0f213d;color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;
  max-width:min(92vw,440px);text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:60;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* Teacher Console */
.t-fab{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 6px 18px rgba(15,33,61,.24)}
.t-backdrop{position:fixed;inset:0;background:rgba(15,33,61,.5);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.t-sheet{
  background:#fff;width:100%;max-width:740px;max-height:85vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(15,33,61,.22);
}
.t-note-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px}
.t-badge-ahead{display:inline-block;background:#ecfdf5;color:#065f46;border:1px solid #86efac;padding:2px 8px;border-radius:8px;font-weight:800;font-size:13px}

function load(){
  try{
    var raw = JSON.parse(localStorage.getItem(KEY)||'null');
    if(!raw || !raw._t || (Date.now()-raw._t) > CONFIG.stateTtlMs) return null;
    var base = freshState();
    for(var k in base){
      if(raw[k] !== undefined && typeof raw[k] === typeof base[k] && Array.isArray(raw[k]) === Array.isArray(base[k])){
        if(k === 'notes' && (!raw[k] || !Array.isArray(raw[k].stars) || !Array.isArray(raw[k].ups))) continue;
        base[k] = raw[k];
      }
    }
    return base;
  }catch(e){ return null; }
}

/* =========================================================
   WEBAUDIO MICRO-CHIMES + IOS-HARDENED SPEECHSYNTHESIS
========================================================= */
var audioCtx = null;
function playChime(kind){
  if(!S.fxOn) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var now = audioCtx.currentTime;
    var notes = kind==='done' ? [523.25,659.25,783.99] : (kind==='match' ? [587.33,783.99] : (kind==='err' ? [329.63,293.66] : [523.25,659.25]));
    notes.forEach(function(freq, idx){
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx*0.09);
      g.gain.setValueAtTime(0.001, now + idx*0.09);
      g.gain.exponentialRampToValueAtTime(0.08, now + idx*0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + idx*0.09 + 0.22);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now + idx*0.09);
      osc.stop(now + idx*0.09 + 0.24);
    });
  }catch(e){}
}

var audioOK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
var voices = [], speakTimer = null;
function lv(){ if(audioOK){ try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; } } }
if(audioOK){
  lv();
  try{ window.speechSynthesis.addEventListener('voiceschanged', lv); }
  catch(e){ window.speechSynthesis.onvoiceschanged = lv; }
}
function pickVoice(lang){
  var l = lang.toLowerCase(), b = l.slice(0,2);
  var pref = /Samantha|Ava|Allison|Aria|Jenny|Google US English|Paulina|Monica|Sabina/i;
  var ex = voices.filter(function(v){ return (v.lang||'').replace('_','-').toLowerCase()===l; });
  var ba = voices.filter(function(v){ return (v.lang||'').toLowerCase().indexOf(b)===0; });
  return ex.filter(function(v){return pref.test(v.name);})[0] || ex[0] || ba.filter(function(v){return pref.test(v.name);})[0] || ba[0] || null;
}
function speak(text, lang){
  if(!text) return;
  if(!audioOK){ toast('Audio is not available on this browser. Read aloud with your teacher!'); return; }
  var ss = window.speechSynthesis;
  if(!voices.length) lv();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  var v = pickVoice(u.lang); if(v) u.voice = v;
  u.rate = S.slow ? 0.72 : 0.94;
  u.onerror = function(ev){
    if(ev && ev.error && ev.error !== 'interrupted' && ev.error !== 'canceled'){
      toast('No audio? Check device volume & silent switch, or open in Safari.');
    }
  };
  clearTimeout(speakTimer);
  try{ if(ss.paused) ss.resume(); }catch(e){}
  if(ss.speaking || ss.pending){
    ss.cancel();
    speakTimer = setTimeout(function(){ try{ ss.speak(u); }catch(e){} }, 80);
  } else {
    try{ ss.speak(u); }catch(e){}
  }
}

/* =========================================================
   PEXELS LIVE API CLIENT + 7-DAY CACHE
========================================================= */
var PEXELS_MEM = {};
var pxQueue = [], pxInFlight = 0, pxRequested = {}, pxFailed = {};

function loadPexelsCache(){
  try{
    var raw = JSON.parse(localStorage.getItem(PEXELS_CACHE_KEY)||'null');
    if(!raw || !raw._t || (Date.now()-raw._t) > CONFIG.pexelsTtlMs) return;
    if(raw.items && typeof raw.items === 'object') PEXELS_MEM = raw.items;
  }catch(e){}
}
function savePexelsCache(){
  try{ localStorage.setItem(PEXELS_CACHE_KEY, JSON.stringify({_t:Date.now(), items:PEXELS_MEM})); }catch(e){}
}
loadPexelsCache();

function applyPexelsToDom(id){
  var p = PEXELS_MEM[id];
  if(!p || !p.url) return;
  var imgs = document.querySelectorAll('[data-px-img="'+id+'"]');
  for(var i=0;i<imgs.length;i++){
    var img = imgs[i];
    var sz = img.getAttribute('data-px-sz')==='thumb' ? (p.thumb||p.url) : p.url;
    if(img.getAttribute('src') !== sz){
      img.setAttribute('src', sz);
      img.style.display = 'block';
    }
  }
  var creds = document.querySelectorAll('[data-px-cred="'+id+'"]');
  for(var j=0;j<creds.length;j++){
    var cr = creds[j];
    cr.innerHTML = 'Photo: <a href="'+esc(p.byUrl||'https://www.pexels.com')+'" target="_blank" rel="noopener">'+esc(p.by||'Pexels')+'</a> / <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a>';
    cr.style.display = 'block';
  }
}

function pxProcessQueue(){
  while(pxInFlight < 3 && pxQueue.length > 0){
    (function(id){
      pxInFlight++;
      var q = PEXELS_QUERIES[id] || id;
      var xhr = new XMLHttpRequest();
      var url = 'https://api.pexels.com/v1/search?query='+encodeURIComponent(q)+'&per_page=1&orientation=landscape';
      xhr.open('GET', url, true);
      xhr.setRequestHeader('Authorization', CONFIG.pexelsKey);
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        pxInFlight = Math.max(0, pxInFlight - 1);
        if(xhr.status >= 200 && xhr.status < 300){
          try{
            var data = JSON.parse(xhr.responseText);
            if(data && data.photos && data.photos.length > 0){
              var ph = data.photos[0];
              PEXELS_MEM[id] = {
                url: (ph.src && (ph.src.medium || ph.src.landscape || ph.src.small)) || '',
                thumb: (ph.src && (ph.src.tiny || ph.src.small || ph.src.medium)) || '',
                by: ph.photographer || 'Pexels',
                byUrl: ph.photographer_url || ph.url || 'https://www.pexels.com'
              };
              savePexelsCache();
              applyPexelsToDom(id);
            } else { pxFailed[id] = true; }
          }catch(e){ pxFailed[id] = true; }
        } else { pxFailed[id] = true; }
        pxProcessQueue();
      };
      xhr.onerror = function(){ pxInFlight = Math.max(0, pxInFlight - 1); pxFailed[id] = true; pxProcessQueue(); };
      try{ xhr.send(); }catch(e){ pxInFlight = Math.max(0, pxInFlight - 1); pxFailed[id] = true; pxProcessQueue(); }
    })(pxQueue.shift());
  }
}

function requestPexels(id){
  if(!id || !PEXELS_QUERIES[id]) return;
  if(PEXELS_MEM[id] && PEXELS_MEM[id].url) return;
  if(pxRequested[id] || pxFailed[id]) return;
  pxRequested[id] = true;
  pxQueue.push(id);
  pxProcessQueue();
}

function pxLoadVisible(){
  var nodes = document.querySelectorAll('[data-px-img]');
  for(var i=0;i<nodes.length;i++) requestPexels(nodes[i].getAttribute('data-px-img'));
}

function computeVibeStats(){
  var same = 0, diff = 0, total = 0, mindPts = 0;
  for(var i=0;i<HOT_TAKES.length;i++){
    var tk = S.takes[i];
    if(tk && tk.s1 && tk.s2){
      total++;
      var pos1 = (tk.s1==='love'||tk.s1==='like');
      var pos2 = (tk.s2==='love'||tk.s2==='like');
      var isSame = (pos1 === pos2);
      if(isSame) same++; else diff++;
      if(S.takePred[i] && ((S.takePred[i]==='same'&&isSame)||(S.takePred[i]==='diff'&&!isSame))) mindPts++;
    }
  }
  return {same:same, diff:diff, total:total, mindPts:mindPts};
}
function fmtTime(sec){
  var s = Math.max(0, Math.floor(sec));
  var m = Math.floor(s/60), r = s%60;
  return m+':'+(r<10?'0':'')+r;
}
function timerRemaining(){
  if(S.timerRun) return Math.max(0, Math.ceil((S.timerEnd - Date.now())/1000));
  return S.timerLeft;
}
function stopTimer(){
  if(S.timerRun){ S.timerLeft = timerRemaining(); S.timerRun = false; S.timerEnd = 0; }
  if(timerId){ clearInterval(timerId); timerId = null; }
}
function tickTimer(){
  var left = timerRemaining();
  var tv = document.getElementById('timerVal');
  if(tv) tv.textContent = fmtTime(left);
  if(left <= 0){
    S.timerRun = false; S.timerLeft = 0; S.timerEnd = 0;
    if(timerId){ clearInterval(timerId); timerId = null; }
    playChime('done');
    speak('Time is up! Swap turns or report to your teacher!');
    try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
    render();
  }
}
function startTimer(){
  if(S.timerLeft <= 0) S.timerLeft = TIMER_LEN;
  S.timerEnd = Date.now() + S.timerLeft*1000;
  S.timerRun = true;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(tickTimer, 500);
  save();
}

function stopPeekTimer(){
  if(peekTickId){ clearInterval(peekTickId); peekTickId = null; }
}
function peekRemaining(){
  if(!S.mysHidden && S.mysPeekEnd) return Math.max(0, Math.ceil((S.mysPeekEnd - Date.now())/1000));
  return 0;
}
function tickPeek(){
  var rem = peekRemaining();
  var el = document.getElementById('peekCount');
  if(el) el.textContent = 'Hide ('+rem+'s)';
  if(rem <= 0){
    S.mysHidden = true; S.mysPeekEnd = 0;
    stopPeekTimer();
    if(S.step === 4) render(); else save();
  }
}
function startPeek(){
  S.mysHidden = false;
  S.mysPeekEnd = Date.now() + PEEK_LEN*1000;
  stopPeekTimer();
  peekTickId = setInterval(tickPeek, 400);
}

function is3p(sub){ return sub==='StudentA' || sub==='StudentB' || sub==='She' || sub==='He' || sub==='Mom' || sub==='Dad'; }
function subjKeepCase(sub){ return (sub==='I'||sub==='StudentA'||sub==='StudentB'||sub==='Mom'||sub==='Dad') ? sub : sub.toLowerCase(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function doAux(sub){ return is3p(sub) ? 'does' : 'do'; }
function doNeg(sub){ return is3p(sub) ? "doesn't" : "don't"; }
function beForm(sub){ return sub==='I' ? 'am' : (is3p(sub) ? 'is' : 'are'); }
function beNeg(sub){ return sub==='I' ? 'am not' : (is3p(sub) ? "isn't" : "aren't"); }
function shortAns(kind, sub){
  var who = {'I':'you','You':'I','StudentA':'he/she','StudentB':'he/she','She':'she','He':'he','Mom':'she','Dad':'he','We':'we','They':'they'}[sub] || 'he/she';
  if(kind==='do'){
    return (who==='she'||who==='he'||who==='he/she') ? 'Yes, '+who+' does. / No, '+who+" doesn't." : 'Yes, '+who+' do. / No, '+who+" don't.";
  }
  if(who==='I') return 'Yes, I am. / No, I\'m not.';
  if(who==='you') return 'Yes, you are. / No, you aren\'t.';
  if(who==='she'||who==='he'||who==='he/she') return 'Yes, '+who+' is. / No, '+who+" isn't.";
  return 'Yes, '+who+' are. / No, '+who+" aren't.";
}function currentMixItem(){
  return S.track==='do' ? (TRACK_A_ITEMS[S.bVerb] || TRACK_A_ITEMS[0])
                        : (TRACK_B_ITEMS[S.bVerb] || TRACK_B_ITEMS[0]);
}
function validWhList(){ var it = currentMixItem(); return WH_ORDER.filter(function(k){ return !!it.wh[k]; }); }
function ensureWh(){
  var list = (S.track==='do' ? TRACK_A_ITEMS : TRACK_B_ITEMS);
  if(S.bVerb >= list.length) S.bVerb = 0;
  var ok = validWhList();
  if(ok.indexOf(S.bWh) < 0) S.bWh = ok[0] || 'Why';
}
function stFor(it, sub){ return (sub==='We'||sub==='They') ? it.stPl : it.st; }
function buildMixSentence(){
  ensureWh();
  var sub = S.bSubj, s = subjKeepCase(sub), it = currentMixItem(), T, text;
  if(S.track==='do'){
    var aux = doAux(sub), vb = is3p(sub) ? it.v3 : it.verb;
    if(S.bPol==='+'){
      T=[{c:'i',t:sub},{c:'v',t:vb},{c:it.oc,t:it.obj+'.'}];
      text = sub+' '+vb+' '+it.obj+'.';
    } else if(S.bPol==='-'){
      T=[{c:'i',t:sub},{c:'v',t:doNeg(sub)},{c:'v',t:it.verb},{c:it.oc,t:it.obj+'.'}];
      text = sub+' '+doNeg(sub)+' '+it.verb+' '+it.obj+'.';
    } else if(S.bPol==='?'){
      T=[{c:'v',t:cap(aux)},{c:'i',t:s},{c:'v',t:it.verb},{c:it.oc,t:it.obj+'?'},{c:'c',t:shortAns('do',sub)}];
      text = cap(aux)+' '+s+' '+it.verb+' '+it.obj+'?';
    } else {
      var tpl = it.wh[S.bWh];
      text = tpl.replace('{aux}',aux).replace('{s}',s);
      var m = tpl.match(/^(.*?)\s*\{aux\}\s*\{s\}\s*(.*)$/);
      var rest = m[2].replace(/\?$/,'');
      T = [{c:'c',t:m[1]},{c:'v',t:aux},{c:'i',t:s}];
      if(rest.indexOf(it.verb)===0){
        T.push({c:'v',t:it.verb});
        var tail = rest.slice(it.verb.length).trim();
        if(tail) T.push({c:'n',t:tail});
      } else if(rest){ T.push({c:'n',t:rest}); }
      T[T.length-1].t += '?';
    }
  } else {
    var be = beForm(sub), stTxt = stFor(it, sub);
    if(S.bPol==='+'){
      T=[{c:'i',t:sub},{c:'v',t:be},{c:'n',t:stTxt+'.'}];
      text = sub+' '+be+' '+stTxt+'.';
    } else if(S.bPol==='-'){
      T=[{c:'i',t:sub},{c:'v',t:beNeg(sub)},{c:'n',t:stTxt+'.'}];
      text = sub+' '+beNeg(sub)+' '+stTxt+'.';
    } else if(S.bPol==='?'){
      T=[{c:'v',t:cap(be)},{c:'i',t:s},{c:'n',t:stTxt+'?'},{c:'c',t:shortAns('be',sub)}];
      text = cap(be)+' '+s+' '+stTxt+'?';
    } else {
      var tpl2 = it.wh[S.bWh];
      text = tpl2.replace('{be}',be).replace('{s}',s).replace('{st}',stTxt);
      var m2 = tpl2.match(/^(.*?)\s*\{be\}\s*\{s\}\s*(.*)$/);
      var rest2 = m2[2].replace('{st}',stTxt).replace(/\?$/,'');
      T = [{c:'c',t:m2[1]},{c:'v',t:be},{c:'i',t:s}];
      if(rest2) T.push({c:'n',t:rest2});
      T[T.length-1].t += '?';
    }
  }
  return {tokens:T, text:text};
}

function copyText(txt, cb){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.fontSize='16px';
    document.body.appendChild(ta); ta.select();
    try{ ta.setSelectionRange(0, txt.length); }catch(e){}
    var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); cb(ok);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ cb(true); }, fallback);
  } else { fallback(); }
}

function clockSummaryHtml(){
  var elapsed = S.clockAcc + (S.clockT0 ? (Date.now() - S.clockT0) : 0);
  var targetMin = STAGE_END_MIN[S.step] || 60;
  var targetMs = targetMin * 60000;
  var diffSec = Math.round((targetMs - elapsed) / 1000);
  var badge = diffSec >= 0
    ? '<span class="t-badge-ahead">ahead by '+fmtTime(diffSec)+'</span>'
    : '<span class="t-badge-behind">behind by '+fmtTime(-diffSec)+'</span>';
  return '<strong>'+fmtTime(elapsed/1000)+' elapsed</strong> — Stage '+(S.step+1)+' target end '+targetMin+':00 — '+badge;
}
function stopClockTimer(){

}

var STEP_FNS = [s0,s1,s2,s3,s4,s5,s6];

function announce(msg){
  var L = document.getElementById('live'); if(!L) return;
  L.textContent = '';
  setTimeout(function(){ L.textContent = msg; }, 40);
}

function updateChrome(){
  var d = document.getElementById('dots'), h = '';
  for(var i=0;i<STEPS.length;i++){
    h += '<button type="button" class="dot'+(i<S.step?' done':(i===S.step?' now':''))+'" data-act="jump" data-arg="'+i+'" aria-label="Go to step '+(i+1)+': '+esc(STEPS[i])+'"'+(i===S.step?' aria-current="step"':'')+'></button>';
  }
  d.innerHTML = h;
  document.getElementById('stepSub').textContent = STEPS[S.step]+' • '+p1()+' & '+p2();
  var laLbl = document.getElementById('lblA'), lbLbl = document.getElementById('lblB');
  if(laLbl) laLbl.textContent = p1()+':';
  if(lbLbl) lbLbl.textContent = p2()+':';

  [1,2,3].forEach(function(n){
    var ba = document.getElementById('la'+n), bb = document.getElementById('lb'+n);
    if(ba){ ba.classList.toggle('on', S.lvlA===n); ba.setAttribute('aria-pressed', S.lvlA===n?'true':'false'); }
    if(bb){ bb.classList.toggle('on', S.lvlB===n); bb.setAttribute('aria-pressed', S.lvlB===n?'true':'false'); }
  });

  var sb = document.getElementById('slowBtn');
  if(sb){ sb.textContent = 'Slow: '+(S.slow?'On':'Off'); sb.classList.toggle('on', !!S.slow); sb.setAttribute('aria-pressed', S.slow?'true':'false'); }
  var fb = document.getElementById('fxBtn');
  if(fb){ fb.textContent = 'FX: '+(S.fxOn?'On':'Off'); fb.classList.toggle('on', !!S.fxOn); fb.setAttribute('aria-pressed', S.fxOn?'true':'false'); }

  var back = document.getElementById('backBtn'), next = document.getElementById('nextBtn');
  var last = (S.step === STEPS.length-1);
  back.disabled = S.step===0;
  if(!last){
    next.textContent = 'Next: '+STEPS[S.step+1];
    next.setAttribute('data-act','next');
  } else {
    next.textContent = restartArmed ? 'Tap again to restart' : 'Restart Class 2';
    next.setAttribute('data-act','restart');
  }
  next.classList.toggle('ghost', last);
  next.classList.toggle('pri', !last);

  var topEl = document.querySelector('.top');
  if(topEl) topEl.classList.toggle('open', gearOpen);
  var gb = document.getElementById('gearBtn');
  if(gb){
    gb.textContent = p1()+' L'+S.lvlA+' · '+p2()+' L'+S.lvlB+(S.slow?' · Slow':'')+' ▾';
    gb.setAttribute('aria-expanded', gearOpen?'true':'false');
  }
  renderTeacher();
}

function render(opts){
  opts = opts || {};
  var y = window.pageYOffset;
  var ae = document.activeElement, fa = null, fg = null;
  if(ae && ae !== document.body && app.contains(ae) && (ae.tagName === 'BUTTON' || ae.getAttribute('role') === 'button')){
    fa = ae.getAttribute('data-act'); fg = ae.getAttribute('data-arg');
  }
  try{
    app.innerHTML = STEP_FNS[S.step]();
  }catch(err){
    app.innerHTML = '<div class="card"><h2>Oops — something slipped</h2>'+
      '<p class="sub">Tap the button below to reset Class 2 cleanly.</p>'+
      '<button type="button" class="btn pri" data-act="hardreset">Restart Class 2</button></div>';
  }
  updateChrome();
  pxLoadVisible();
  if(S.step===5 && S.podStage==='interview' && S.timerRun && !timerId){ timerId = setInterval(tickTimer, 500); }
  if(S.step===4 && !S.mysHidden && !peekTickId){ peekTickId = setInterval(tickPeek, 400); }
  save();
  if(!opts.top) window.scrollTo(0, y);
  if(fa){
    var sel = '[data-act="'+fa+'"]'+(fg!==null ? '[data-arg="'+String(fg).replace(/["\\]/g,'\\$&')+'"]' : '');
    var el = app.querySelector(sel);
    if(el){ try{ el.focus({preventScroll:true}); }catch(e){} }
  }
}

function goStep(n){
  n = Math.max(0, Math.min(STEPS.length-1, n));
  if(n !== 5) stopTimer();
  if(n !== 4) stopPeekTimer();
  restartArmed = false; clearTimeout(restartTimer);
  S.step = n;
  if(audioOK) try{ window.speechSynthesis.cancel(); }catch(e){}
  render({top:true});
  window.scrollTo(0,0);
  var h = app.querySelector('h2');
  if(h){ h.setAttribute('tabindex','-1'); try{ h.focus({preventScroll:true}); }catch(e){} }
  announce('Stage '+(n+1)+' of '+STEPS.length+': '+STEPS[n]);
}

function toggleArr(arr, val, max){
  var i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1);
  else{
    if(max && arr.length>=max) arr.shift();
    arr.push(val);
  }
}

function act(el){
  var a = el.getAttribute('data-act'), arg = el.getAttribute('data-arg') || '';
  switch(a){
    case 'say': speak(arg); break;
    case 'next': goStep(S.step+1); break;
    case 'back': goStep(S.step-1); break;
    case 'jump': goStep(parseInt(arg,10)); break;
    case 'gear': gearOpen = !gearOpen; updateChrome(); break;
    case 'hardreset':
      stopTimer(); stopPeekTimer();
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = freshState(); applyUrlParams(); render({top:true}); break;
    case 'restart':
      if(!restartArmed){
        restartArmed = true; updateChrome();
        clearTimeout(restartTimer);
        restartTimer = setTimeout(function(){ restartArmed = false; updateChrome(); }, 4000);
        break;
      }
      restartArmed = false; clearTimeout(restartTimer);
      stopTimer(); stopPeekTimer();
      try{ localStorage.removeItem(KEY); }catch(e){}
      S = freshState(); applyUrlParams(); render({top:true}); window.scrollTo(0,0);
      break;
    case 'slow': S.slow = !S.slow; updateChrome(); save(); break;
    case 'fx': S.fxOn = !S.fxOn; if(S.fxOn) playChime('good'); updateChrome(); save(); break;
    case 'lvla': S.lvlA = parseInt(arg,10); render(); break;
    case 'lvlb': S.lvlB = parseInt(arg,10); render(); break;

    // Stage 1
    case 'takepred': S.takePred[S.takeIdx] = arg; playChime('good'); render(); break;
    case 'take':
      var tp = arg.split(':');
      if(!S.takes[S.takeIdx]) S.takes[S.takeIdx] = {};
      S.takes[S.takeIdx][tp[0]] = tp[1];
      var tNow = S.takes[S.takeIdx];
      if(tNow.s1 && tNow.s2){
        var p1Pos = (tNow.s1==='love'||tNow.s1==='like'), p2Pos = (tNow.s2==='love'||tNow.s2==='like');
        playChime(p1Pos===p2Pos ? 'match' : 'good');
      }
      render(); break;
    case 'takenav':
      S.takeIdx = Math.max(0, Math.min(HOT_TAKES.length-1, S.takeIdx+parseInt(arg,10)));
      render(); break;

    // Stage 2
    case 'gist': S.gist = arg; if(arg==='mom') playChime('good'); else playChime('err'); render(); break;
    case 'es': S.es = !S.es; render(); break;
    case 'disc':
      var dp = arg.split(':');
      var di = parseInt(dp[0],10), oi = parseInt(dp[1],10);
      S.disc[di] = oi;
      playChime(DISCOVERY[di].ans===oi ? 'good' : 'err');
      render(); break;

    // Stage 3
    case 'mixsp': S.mixSpeaker = arg; S.revealB = false; render(); break;
    case 'track': S.track = arg; S.bVerb = 0; S.revealB = false; ensureWh(); render(); break;
    case 'bsubj': S.bSubj = arg; S.revealB = false; ensureWh(); render(); break;
    case 'bpol': S.bPol = arg; S.revealB = false; ensureWh(); render(); break;
    case 'bwh': S.bWh = arg; S.revealB = false; render(); break;
    case 'bverb': S.bVerb = parseInt(arg,10); S.revealB = false; ensureWh(); render(); break;
    case 'revealb': S.revealB = true; render(); break;
    case 'sort':
      var sp = arg.split(':');
      var si = parseInt(sp[0],10);
      S.sortAns[si] = sp[1];
      playChime(PRON_SORT[si].sound===sp[1] ? 'good' : 'err');
      render(); break;
    case 'vocabcheck': toggleArr(S.vocabDone, arg); playChime('good'); render(); break;
    case 'proncheck': toggleArr(S.pronDone, arg); playChime('good'); render(); break;

    // Stage 4
    case 'bug':
      var cPos = arg.indexOf(':');
      var bi = parseInt(arg.slice(0,cPos),10);
      var ch = arg.slice(cPos+1);
      if(S.bugs[bi] && S.bugs[bi].done) break;
      var right = (ch===BUGS[bi].ans);
      S.bugs[bi] = {choice:ch, done:right, tries:((S.bugs[bi]&&S.bugs[bi].tries)||0)+1};
      playChime(right ? 'good' : 'err');
      render(); break;
    case 'scradd':
      if(S.scrDone[S.scrIdx]) break;
      if(!S.scrPick[S.scrIdx]) S.scrPick[S.scrIdx] = [];
      var pos = parseInt(arg,10);
      if(S.scrPick[S.scrIdx].indexOf(pos) < 0) S.scrPick[S.scrIdx].push(pos);
      render(); break;
    case 'scrundo':
      if(S.scrDone[S.scrIdx] || !S.scrPick[S.scrIdx]) break;
      S.scrPick[S.scrIdx].pop(); render(); break;
    case 'scrclear':
      if(S.scrDone[S.scrIdx]) break;
      S.scrPick[S.scrIdx] = []; render(); break;
    case 'scrcheck':
      var curSc = SCRAMBLES[S.scrIdx] || SCRAMBLES[0];
      var arr = S.scrPick[S.scrIdx] || [];
      var built = arr.map(function(x){ return scrWord(curSc.words[curSc.shuffled[x]]); }).join(' ');
      if(built === scrWord(curSc.answer)){ S.scrDone[S.scrIdx] = true; playChime('done'); }
      else { playChime('err'); }
      render(); break;
    case 'scrnav':
      S.scrIdx = Math.max(0, Math.min(SCRAMBLES.length-1, S.scrIdx+parseInt(arg,10)));
      render(); break;

    // Stage 5
    case 'bluffpack':
      var pkIdx = parseInt(arg,10);
      S.bluffPack = pkIdx;
      S.bluffTexts = BLUFF_PACKS[pkIdx].items.slice(0);
      S.bluffLie = BLUFF_PACKS[pkIdx].defLie;
      render(); break;
    case 'blufflie': S.bluffLie = parseInt(arg,10); render(); break;
    case 'blufflock':
      S.bluffStep = 'ask'; S.bluffQs = []; S.bluffQ = ''; S.bluffGuess = -1;
      playChime('good'); render(); break;
    case 'bluffq':
      var bq = (S.bluffQ||'').trim() ? S.bluffQ.trim() : 'Clue question #'+(S.bluffQs.length+1);
      S.bluffQs.push(bq); S.bluffQ = ''; playChime('good'); render(); break;
    case 'bluffguess':
      S.bluffGuess = parseInt(arg,10);
      S.bluffStep = 'reveal';
      if(S.bluffGuess === S.bluffLie){ S.bluffHits++; playChime('done'); } else { playChime('err'); }
      render(); break;
    case 'bluffnext':
      S.bluffRound = 2; S.bluffStep = 'pick';
      S.bluffPack = (S.bluffPack + 1) % BLUFF_PACKS.length;
      S.bluffTexts = BLUFF_PACKS[S.bluffPack].items.slice(0);
      S.bluffLie = BLUFF_PACKS[S.bluffPack].defLie;
      S.bluffQs = []; S.bluffQ = ''; S.bluffGuess = -1;
      render(); break;

    // Stage 6
    case 'podstage':
      if(arg!=='interview') stopTimer();
      S.podStage = arg; render(); break;
    case 'satwho': S.satActiveWho = arg; render(); break;
    case 'satslot': S.satActiveSlot = arg; render(); break;
    case 'satpick':
      (S.satActiveWho==='a' ? S.satP1 : S.satP2)[S.satActiveSlot] = arg;
      playChime('good'); render(); break;
    case 'satfinal':
      var fp = arg.split(':');
      S.satFinal[fp[0]] = fp[1];
      playChime('good'); render(); break;
    case 'timertog':
      if(S.timerRun) stopTimer(); else startTimer();
      render(); break;
    case 'timerreset': stopTimer(); S.timerLeft = TIMER_LEN; render(); break;
    case 'podver':
      var vp = arg.split(':');
      if(vp[0]==='1') S.podVerify1 = vp[1]; else S.podVerify2 = vp[1];
      playChime('good'); render(); break;

    // Stage 7
    case 'saystar': speak(S.stars[parseInt(arg,10)]||''); break;
    case 'upgdone':
      var ui = parseInt(arg,10);
      if(!S.upgrades[ui].done && !S.upgrades[ui].fixed.trim()){ toast('Type the upgraded sentence first!'); break; }
      S.upgrades[ui].done = !S.upgrades[ui].done;
      if(S.upgrades[ui].done) playChime('good');
      render(); break;
    case 'fillnotes':
      S.stars[0] = S.notes.stars[0] || '';
      S.stars[1] = S.notes.stars[1] || '';
      for(var ni=0;ni<3;ni++) S.upgrades[ni] = {bad:(S.notes.ups[ni]||''), fixed:'', done:false};
      render(); break;
    case 'fillexamples':
      S.stars = [p1()+' loves spicy tacos because they are delicious!', p2()+' prefers pop music, and my mom likes iced coffee!'];
      S.upgrades = [
        {bad:'My mom don\'t like chocolate.', fixed:'', done:false},
        {bad:'Are you want ice cream?', fixed:'', done:false},
        {bad:'I love puppies because are cute.', fixed:'', done:false}
      ];
      render(); break;
    case 'rate': S.rating = parseInt(arg,10); playChime('good'); render(); break;
    case 'cando': toggleArr(S.candos, parseInt(arg,10)); playChime('good'); render(); break;
    case 'copyhw':
      copyText(missionText(), function(ok){ S.hwCopied = ok; S.hwFail = !ok; if(ok) playChime('done'); render(); });
      break;
    case 'sharehw':
      if(navigator.share){ navigator.share({title:'BAA Class 2 Voice Mission', text:missionText()}).catch(function(){}); }
      break;

    // Teacher Console
    case 'topen': teacherOpen = !teacherOpen; renderTeacher(); break;
    case 'tclose': teacherOpen = false; renderTeacher(); break;
    case 'tpin': S.teacher = !S.teacher; save(); renderTeacher(); break;
    case 'tclock':
      if(S.clockT0){ S.clockAcc += (Date.now() - S.clockT0); S.clockT0 = 0; }
      else { S.clockT0 = Date.now(); }
      save(); renderTeacher(); break;
    case 'tclockreset': S.clockAcc = 0; S.clockT0 = 0; save(); renderTeacher(); break;
    case 'taddstar':
      var ti = document.getElementById('tNoteInput');
      if(ti && ti.value.trim()){
        if(S.notes.stars.length >= 10) S.notes.stars.shift();
        S.notes.stars.push(ti.value.trim());
        ti.value = ''; save(); renderTeacher();
      }
      break;
    case 'taddup':
      var ti2 = document.getElementById('tNoteInput');
      if(ti2 && ti2.value.trim()){
        if(S.notes.ups.length >= 10) S.notes.ups.shift();
        S.notes.ups.push(ti2.value.trim());
        ti2.value = ''; save(); renderTeacher();
      }
      break;
    case 'tdelstar': S.notes.stars.splice(parseInt(arg,10),1); save(); renderTeacher(); break;
    case 'tdelup': S.notes.ups.splice(parseInt(arg,10),1); save(); renderTeacher(); break;
  }
}
document.addEventListener('click', function(e){
  if(e.target && e.target.closest && e.target.closest('a')) return;
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-act')==='tbackdrop'){
    teacherOpen = false; renderTeacher(); return;
  }
  var el = e.target.closest('[data-act]');
  if(el && el.getAttribute('data-act')!=='tbackdrop') act(el);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && teacherOpen){ teacherOpen = false; renderTeacher(); return; }
  if((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role="button"]')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id==='n1'){ S.s1 = t.value; updateChrome(); save(); }
  else if(t.id==='n2'){ S.s2 = t.value; updateChrome(); save(); }
  else if(t.id==='bluffQInput'){ S.bluffQ = t.value; save(); }
  else if(t.hasAttribute('data-blufftxt')){ S.bluffTexts[parseInt(t.getAttribute('data-blufftxt'),10)] = t.value; save(); }
  else if(t.id==='podNotes'){
    S.podNotes1 = t.value;

    save();
  }
  else if(t.hasAttribute('data-star')){ S.stars[parseInt(t.getAttribute('data-star'),10)] = t.value; save(); }
  else if(t.hasAttribute('data-upgbad')){ S.upgrades[parseInt(t.getAttribute('data-upgbad'),10)].bad = t.value; save(); }
  else if(t.hasAttribute('data-upgfix')){ S.upgrades[parseInt(t.getAttribute('data-upgfix'),10)].fixed = t.value; save(); }
});
document.addEventListener('focusin', function(e){
  if(e.target.matches && e.target.matches('input[type=text],textarea')) document.body.classList.add('typing');
});
document.addEventListener('focusout', function(){
  setTimeout(function(){
    var a = document.activeElement;
    if(!(a && a.matches && a.matches('input[type=text],textarea'))) document.body.classList.remove('typing');
  }, 60);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){
    if(S.timerRun) tickTimer();
    if(!S.mysHidden && S.mysPeekEnd) tickPeek();
  }
});

render();
})();
</script>
</body>
</html>
